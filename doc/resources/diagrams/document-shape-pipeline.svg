<?xml version="1.0" encoding="UTF-8"?>
<!--
  Block diagram: pipeline stages, left to right (block standard, "Pipeline stages").
  Equal stage boxes with arrows in 40 px gutters; no track geometry, so not a flow diagram.
  The tinted box is the truth; the dashed box holds what is computed and never stored.
  theme-handling: A (theme-neutral)
  see pm-documents:ref-svg-diagrams/standards/theme-handling.md
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 324"
     role="img" aria-labelledby="title desc"
     font-family="ui-sans-serif, -apple-system, system-ui, 'Segoe UI', sans-serif">
  <title id="title">The shape of a schema-driven document</title>
  <desc  id="desc">Six stages from left to right: a JSON Schema produces the form and validates the data, in the user interface and in CI; the form edits the data; the data are YAML with free-text AsciiDoc fragments and are the truth; a template joins data and text into the generated report.adoc and PDF; review, signature and tag approve and freeze the result. Below, drawn dashed, deadlines, typed links and evaluations are computed from the in-memory index across all documents and never stored. report.adoc is generated and committed; a check that it matches the YAML runs in CI as well.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" class="arrow-fill"/>
    </marker>
    <style>
      .hdr        { font-size: 15px; font-weight: 600; fill: #6e7681; text-anchor: middle; }
      .sub        { font-size: 11px; fill: #6e7681; text-anchor: middle; font-style: italic; }
      .item-c     { font-size: 12px; fill: #6e7681; font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; text-anchor: middle; }
      .item-b     { font-size: 12px; fill: #6e7681; font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; text-anchor: middle; font-weight: 700; }
      .caption    { font-size: 11px; fill: #6e7681; text-anchor: middle; font-style: italic; }
      .stroke     { stroke: #6e7681; stroke-width: 1.2; fill: none; }
      .stroke-d   { stroke: #6e7681; stroke-width: 1.2; fill: none; stroke-dasharray: 5 4; }
      .tint       { stroke: #6e7681; stroke-width: 1.2; fill: #6e7681; fill-opacity: 0.08; }
      .arrow      { stroke: #6e7681; stroke-width: 1.5; fill: none; }
      .arrow-fill { fill: #6e7681; }
      .sep        { stroke: #6e7681; stroke-width: 0.6; stroke-dasharray: 3 3; }
    </style>
  </defs>
  <text x="520" y="60" class="hdr">One shape for every kind of document</text>

  <rect class="stroke" x="24" y="90" width="132" height="64" rx="6" ry="6"/>
  <text x="90" y="118" class="item-b">schema</text>
  <text x="90" y="138" class="sub">validates in UI and CI</text>
  <line class="arrow" x1="156" y1="122" x2="194" y2="122" marker-end="url(#arrow)"/>

  <rect class="stroke" x="196" y="90" width="132" height="64" rx="6" ry="6"/>
  <text x="262" y="118" class="item-b">form</text>
  <text x="262" y="138" class="sub">edits the data</text>
  <line class="arrow" x1="328" y1="122" x2="366" y2="122" marker-end="url(#arrow)"/>

  <rect class="tint" x="368" y="90" width="132" height="64" rx="6" ry="6"/>
  <text x="434" y="118" class="item-b">data</text>
  <text x="434" y="138" class="sub">YAML + AsciiDoc text</text>
  <line class="arrow" x1="500" y1="122" x2="538" y2="122" marker-end="url(#arrow)"/>

  <rect class="stroke" x="540" y="90" width="132" height="64" rx="6" ry="6"/>
  <text x="606" y="118" class="item-b">template</text>
  <text x="606" y="138" class="sub">joins data and text</text>
  <line class="arrow" x1="672" y1="122" x2="710" y2="122" marker-end="url(#arrow)"/>

  <rect class="stroke" x="712" y="90" width="132" height="64" rx="6" ry="6"/>
  <text x="778" y="118" class="item-b">output</text>
  <text x="778" y="138" class="sub">report.adoc · PDF</text>
  <line class="arrow" x1="844" y1="122" x2="882" y2="122" marker-end="url(#arrow)"/>

  <rect class="stroke" x="884" y="90" width="132" height="64" rx="6" ry="6"/>
  <text x="950" y="118" class="item-b">approval</text>
  <text x="950" y="138" class="sub">review · sign · tag</text>

  <line class="sep" x1="434" y1="154" x2="434" y2="200"/>
  <rect class="stroke-d" x="24" y="200" width="992" height="56" rx="6" ry="6"/>
  <text x="520" y="224" class="item-c">deadlines · typed links · evaluations</text>
  <text x="520" y="244" class="sub">computed from the in-memory index across all documents; never stored</text>

  <text x="520" y="296" class="caption">The YAML data and AsciiDoc fragments are the truth; report.adoc is generated and committed. A check against the YAML runs in CI.</text>
</svg>
