<?xml version="1.0" encoding="UTF-8"?>
<!--
  Flow diagram.
  theme-handling: A (theme-neutral)
  see pm-documents:ref-svg-diagrams/standards/theme-handling.md
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 320"
     role="img" aria-labelledby="title desc"
     font-family="ui-sans-serif, -apple-system, system-ui, 'Segoe UI', sans-serif">
  <title id="title">The shape of a schema-driven document</title>
  <desc  id="desc">Six stages from left to right: a JSON Schema drives the form, which validates in the user interface and in CI; the data are YAML with free-text AsciiDoc fragments and are the truth; a template joins data and text into the generated report.adoc and PDF; review, signature and tag approve and freeze the result. Below, deadlines, typed links and evaluations are computed from the in-memory index across all documents and never stored.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" class="arrow-fill"/>
    </marker>
    <style>
      .hdr        { font-size: 15px; font-weight: 600; fill: #6e7681; text-anchor: middle; }
      .hdr-l      { font-size: 15px; font-weight: 600; fill: #6e7681; text-anchor: start; }
      .sub        { font-size: 11px; fill: #6e7681; text-anchor: middle; font-style: italic; }
      .sub-l      { font-size: 11px; fill: #6e7681; text-anchor: start; font-style: italic; }
      .item       { font-size: 12px; fill: #6e7681; font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
      .item-c     { font-size: 12px; fill: #6e7681; font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; text-anchor: middle; }
      .item-b     { font-size: 12px; fill: #6e7681; font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; text-anchor: middle; font-weight: 700; }
      .lbl        { font-size: 11px; fill: #6e7681; text-anchor: middle; font-style: italic; }
      .caption    { font-size: 12px; fill: #6e7681; text-anchor: middle; font-style: italic; }
      .stroke     { stroke: #6e7681; stroke-width: 1.2; fill: none; }
      .stroke-d   { stroke: #6e7681; stroke-width: 1.2; fill: none; stroke-dasharray: 5 4; }
      .tint       { stroke: #6e7681; stroke-width: 1.2; fill: #6e7681; fill-opacity: 0.08; }
      .arrow      { stroke: #6e7681; stroke-width: 1.5; fill: none; }
      .arrow-ret  { stroke: #6e7681; stroke-width: 1.5; fill: none; stroke-dasharray: 5 4; }
      .arrow-fill { fill: #6e7681; }
      .sep        { stroke: #6e7681; stroke-width: 0.6; stroke-dasharray: 3 3; }
      .activation { stroke: #6e7681; stroke-width: 0.8; fill: #6e7681; fill-opacity: 0.15; }
    </style>
  </defs>
  <rect class="stroke" x="24" y="90" width="132" height="64" rx="6" ry="6"/>
  <text x="90" y="118" class="item-b">schema</text>
  <text x="90" y="138" class="sub">JSON Schema</text>
  <line class="arrow" x1="156" y1="122" x2="182" y2="122" marker-end="url(#arrow)"/>
  <rect class="stroke" x="184" y="90" width="132" height="64" rx="6" ry="6"/>
  <text x="250" y="118" class="item-b">form</text>
  <text x="250" y="138" class="sub">UI and CI validation</text>
  <line class="arrow" x1="316" y1="122" x2="342" y2="122" marker-end="url(#arrow)"/>
  <rect class="tint" x="344" y="90" width="132" height="64" rx="6" ry="6"/>
  <text x="410" y="118" class="item-b">data</text>
  <text x="410" y="138" class="sub">YAML + AsciiDoc text</text>
  <line class="arrow" x1="476" y1="122" x2="502" y2="122" marker-end="url(#arrow)"/>
  <rect class="stroke" x="504" y="90" width="132" height="64" rx="6" ry="6"/>
  <text x="570" y="118" class="item-b">template</text>
  <text x="570" y="138" class="sub">joins data and text</text>
  <line class="arrow" x1="636" y1="122" x2="662" y2="122" marker-end="url(#arrow)"/>
  <rect class="stroke" x="664" y="90" width="132" height="64" rx="6" ry="6"/>
  <text x="730" y="118" class="item-b">output</text>
  <text x="730" y="138" class="sub">report.adoc · PDF</text>
  <line class="arrow" x1="796" y1="122" x2="822" y2="122" marker-end="url(#arrow)"/>
  <rect class="stroke" x="824" y="90" width="132" height="64" rx="6" ry="6"/>
  <text x="890" y="118" class="item-b">approval</text>
  <text x="890" y="138" class="sub">review · sign · tag</text>
  <text x="490" y="60" class="hdr">One shape for every kind of document</text>
  <rect class="stroke-d" x="24" y="200" width="932" height="56" rx="6" ry="6"/>
  <text x="490" y="224" class="item-c">deadlines · typed links · evaluations</text>
  <text x="490" y="244" class="sub">computed from the in-memory index across all documents; never stored</text>
  <line class="sep" x1="410" y1="158" x2="410" y2="196"/>
  <text x="490" y="300" class="caption">The YAML data and AsciiDoc fragments are the truth; report.adoc is generated, committed, and checked in CI.</text>
</svg>
