<?xml version="1.0" encoding="UTF-8"?>
<!--
  Block diagram: three columns.
  theme-handling: A (theme-neutral)
  see pm-documents:ref-svg-diagrams/standards/theme-handling.md
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 416"
     role="img" aria-labelledby="title desc"
     font-family="ui-sans-serif, -apple-system, system-ui, 'Segoe UI', sans-serif">
  <title id="title">Storage engine overview: application server, repository layer and remote</title>
  <desc  id="desc">The application server calls the repository layer in process. The layer holds a local bare clone with branches, tags, notes and draft references that are never pushed, and builds an in-memory index from the references after each fetch or save. It pushes to and fetches from the remote, the organisation's Git server or, on a single server, a local bare repository; the remote is the source of truth and the backup, and the clone is a disposable cache.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" class="arrow-fill"/>
    </marker>
    <style>
      .hdr        { font-size: 15px; font-weight: 600; fill: #6e7681; text-anchor: middle; }
      .hdr-l      { font-size: 15px; font-weight: 600; fill: #6e7681; text-anchor: start; }
      .sub        { font-size: 11px; fill: #6e7681; text-anchor: middle; font-style: italic; }
      .sub-l      { font-size: 11px; fill: #6e7681; text-anchor: start; font-style: italic; }
      .item       { font-size: 12px; fill: #6e7681; font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
      .item-c     { font-size: 12px; fill: #6e7681; font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; text-anchor: middle; }
      .item-b     { font-size: 12px; fill: #6e7681; font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; text-anchor: middle; font-weight: 700; }
      .name       { font-size: 13px; font-weight: 600; fill: #6e7681; text-anchor: middle; }
      .lbl        { font-size: 11px; fill: #6e7681; text-anchor: middle; font-style: italic; }
      .caption    { font-size: 11px; fill: #6e7681; text-anchor: middle; font-style: italic; }
      .stroke     { stroke: #6e7681; stroke-width: 1.2; fill: none; }
      .tint       { stroke: #6e7681; stroke-width: 1.2; fill: #6e7681; fill-opacity: 0.08; }
      .arrow      { stroke: #6e7681; stroke-width: 1.5; fill: none; }
      .arrow-fill { fill: #6e7681; }
      .sep        { stroke: #6e7681; stroke-width: 0.6; stroke-dasharray: 3 3; }
    </style>
  </defs>
  <text x="150" y="32" class="hdr">Application server</text>
  <rect class="stroke" x="30" y="64" width="240" height="292" rx="6" ry="6"/>
  <text x="150" y="114" class="name">UI and API requests</text>
  <text x="150" y="134" class="sub">forms, documents, approvals</text>
  <line class="sep" x1="60" y1="160" x2="240" y2="160"/>
  <text x="150" y="196" class="name">domain logic</text>
  <text x="150" y="220" class="sub">kinds of documents, rights</text>
  <text x="150" y="330" class="sub">calls the store in process</text>
  <text x="450" y="32" class="hdr">Repository layer</text>
  <text x="450" y="50" class="sub">JGit, in process, no working trees</text>
  <rect class="stroke" x="330" y="64" width="240" height="292" rx="6" ry="6"/>
  <rect class="tint" x="340" y="92" width="220" height="104" rx="4" ry="4"/>
  <text x="450" y="116" class="name">local bare clone</text>
  <text x="450" y="138" class="item-c">refs/heads/*  refs/tags/*</text>
  <text x="450" y="156" class="item-c">refs/notes/*</text>
  <text x="450" y="174" class="item-c">refs/drafts/* (never pushed)</text>
  <rect class="tint" x="340" y="236" width="220" height="72" rx="4" ry="4"/>
  <text x="450" y="264" class="name">in-memory index</text>
  <text x="450" y="284" class="sub">built from the references</text>
  <line class="arrow" x1="450" y1="196" x2="450" y2="234" marker-end="url(#arrow)"/>
  <text x="462" y="220" class="sub-l">after fetch or save</text>
  <text x="450" y="338" class="sub">a disposable cache, except the drafts</text>
  <text x="750" y="32" class="hdr">Remote</text>
  <rect class="stroke" x="630" y="64" width="240" height="292" rx="6" ry="6"/>
  <text x="750" y="150" class="name">GitHub · GitLab · Gitea · Forgejo</text>
  <text x="750" y="172" class="sub">source of truth and backup</text>
  <text x="750" y="194" class="sub">rights, reviews, protected main</text>
  <text x="750" y="330" class="sub">or a local bare repository on a single server</text>
  <line class="arrow" x1="270" y1="206" x2="328" y2="206" marker-end="url(#arrow)"/>
  <text x="299" y="198" class="lbl">calls</text>
  <line class="arrow" x1="570" y1="130" x2="628" y2="130" marker-end="url(#arrow)"/>
  <text x="599" y="122" class="lbl">push</text>
  <line class="arrow" x1="628" y1="166" x2="572" y2="166" marker-end="url(#arrow)"/>
  <text x="599" y="158" class="lbl">fetch</text>
  <text x="450" y="392" class="caption">Every repository has a remote; a save lands on the clone only after the remote accepted it.</text>
</svg>
