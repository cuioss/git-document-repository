<?xml version="1.0" encoding="UTF-8"?>
<!--
  Stack diagram: five slabs, heights by content, dashed inter-slab dividers,
  left label gutter and right content region. The tinted slab is the default level.
  theme-handling: A (theme-neutral)
  see pm-documents:ref-svg-diagrams/standards/theme-handling.md
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 524"
     role="img" aria-labelledby="title desc"
     font-family="ui-sans-serif, -apple-system, system-ui, 'Segoe UI', sans-serif">
  <title id="title">Graded traceability: signature levels 0 to 4</title>
  <desc  id="desc">Five stacked signature levels of what a commit shows about its author; each level adds to the one below. Level 0: the author field only, no checked statement. Level 1, the default: the application signs the commit and writes the trailers Actor (the user's pseudonym), Actor-Issuer, Auth-Time, Auth-Context and Session (a session HMAC). Level 2: level 1 plus a fresh MFA step-up before an approval, shown by acr and amr. Level 3: level 2 plus a passkey approval, in which WebAuthn signs a single-use challenge bound to the commit id, stored as a note under refs/notes/approvals; a key the server does not hold approved exactly this state. Level 4: a qualified electronic signature under eIDAS. The required signature level is configured per transition of the workflow.</desc>
  <defs>
    <style>
      .hdr-l      { font-size: 15px; font-weight: 600; fill: #6e7681; text-anchor: start; }
      .sub-l      { font-size: 11px; fill: #6e7681; text-anchor: start; font-style: italic; }
      .item       { font-size: 12px; fill: #6e7681; font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
      .caption    { font-size: 11px; fill: #6e7681; text-anchor: middle; font-style: italic; }
      .stroke     { stroke: #6e7681; stroke-width: 1.2; fill: none; }
      .tint       { stroke: #6e7681; stroke-width: 1.2; fill: #6e7681; fill-opacity: 0.08; }
      .sep        { stroke: #6e7681; stroke-width: 0.6; stroke-dasharray: 3 3; }
    </style>
  </defs>

  <!-- Level 4 -->
  <rect class="stroke" x="40" y="24" width="820" height="64" rx="6" ry="6"/>
  <line class="sep" x1="240" y1="32" x2="240" y2="80"/>
  <text x="60" y="52" class="hdr-l">Level 4</text>
  <text x="60" y="70" class="sub-l">qualified signature</text>
  <text x="260" y="52" class="item">eIDAS remote signing service</text>
  <text x="260" y="70" class="sub-l">legally equal to a handwritten signature · high effort</text>

  <line class="sep" x1="40" y1="100" x2="860" y2="100"/>

  <!-- Level 3 -->
  <rect class="stroke" x="40" y="112" width="820" height="82" rx="6" ry="6"/>
  <line class="sep" x1="240" y1="120" x2="240" y2="186"/>
  <text x="60" y="140" class="hdr-l">Level 3</text>
  <text x="60" y="158" class="sub-l">passkey approval</text>
  <text x="260" y="140" class="item">WebAuthn signs a single-use challenge bound to the commit id</text>
  <text x="260" y="158" class="item">→ refs/notes/approvals</text>
  <text x="260" y="176" class="sub-l">a key the server does not hold approved exactly this state</text>

  <line class="sep" x1="40" y1="206" x2="860" y2="206"/>

  <!-- Level 2 -->
  <rect class="stroke" x="40" y="218" width="820" height="64" rx="6" ry="6"/>
  <line class="sep" x1="240" y1="226" x2="240" y2="274"/>
  <text x="60" y="246" class="hdr-l">Level 2</text>
  <text x="60" y="264" class="sub-l">step-up</text>
  <text x="260" y="246" class="item">level 1 + fresh MFA before the approval (acr / amr)</text>
  <text x="260" y="264" class="sub-l">the user confirmed this very approval with MFA</text>

  <line class="sep" x1="40" y1="294" x2="860" y2="294"/>

  <!-- Level 1 (default) -->
  <rect class="tint" x="40" y="306" width="820" height="82" rx="6" ry="6"/>
  <line class="sep" x1="240" y1="314" x2="240" y2="380"/>
  <text x="60" y="334" class="hdr-l">Level 1</text>
  <text x="60" y="352" class="sub-l">application signature</text>
  <text x="260" y="334" class="item">signed commit + trailers</text>
  <text x="260" y="352" class="item">Actor · Actor-Issuer · Auth-Time · Auth-Context · Session</text>
  <text x="260" y="370" class="sub-l">the application confirms the authenticated user · default</text>

  <line class="sep" x1="40" y1="400" x2="860" y2="400"/>

  <!-- Level 0 -->
  <rect class="stroke" x="40" y="412" width="820" height="60" rx="6" ry="6"/>
  <line class="sep" x1="240" y1="420" x2="240" y2="464"/>
  <text x="60" y="438" class="hdr-l">Level 0</text>
  <text x="60" y="456" class="sub-l">author field</text>
  <text x="260" y="438" class="item">unchecked commit metadata</text>
  <text x="260" y="456" class="sub-l">no checked statement</text>

  <text x="450" y="500" class="caption">Each level adds to the one below. Level 1 is the default for every commit; the required signature level is configured per transition.</text>
</svg>
