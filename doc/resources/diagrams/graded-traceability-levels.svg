<?xml version="1.0" encoding="UTF-8"?>
<!--
  Stack diagram.
  theme-handling: A (theme-neutral)
  see pm-documents:ref-svg-diagrams/standards/theme-handling.md
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 432"
     role="img" aria-labelledby="title desc"
     font-family="ui-sans-serif, -apple-system, system-ui, 'Segoe UI', sans-serif">
  <title id="title">Graded traceability levels 0 to 4</title>
  <desc  id="desc">Five stacked levels of what a commit shows about its author. Level 0: the author field only, no checked statement. Level 1, the default: the application signs the commit and writes the user's pseudonym, issuer, authentication time and a session HMAC as trailers. Level 2: level 1 plus a fresh MFA step-up before an approval. Level 3: level 2 plus a passkey signature over the commit id, stored as a note. Level 4: a qualified electronic signature under eIDAS.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" class="arrow-fill"/>
    </marker>
    <style>
      .hdr        { font-size: 15px; font-weight: 600; fill: #6e7681; text-anchor: middle; }
      .hdr-l      { font-size: 15px; font-weight: 600; fill: #6e7681; text-anchor: start; }
      .sub        { font-size: 11px; fill: #6e7681; text-anchor: middle; font-style: italic; }
      .sub-l      { font-size: 11px; fill: #6e7681; text-anchor: start; font-style: italic; }
      .item       { font-size: 12px; fill: #6e7681; font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
      .item-c     { font-size: 12px; fill: #6e7681; font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; text-anchor: middle; }
      .item-b     { font-size: 12px; fill: #6e7681; font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; text-anchor: middle; font-weight: 700; }
      .lbl        { font-size: 11px; fill: #6e7681; text-anchor: middle; font-style: italic; }
      .caption    { font-size: 12px; fill: #6e7681; text-anchor: middle; font-style: italic; }
      .stroke     { stroke: #6e7681; stroke-width: 1.2; fill: none; }
      .stroke-d   { stroke: #6e7681; stroke-width: 1.2; fill: none; stroke-dasharray: 5 4; }
      .tint       { stroke: #6e7681; stroke-width: 1.2; fill: #6e7681; fill-opacity: 0.08; }
      .arrow      { stroke: #6e7681; stroke-width: 1.5; fill: none; }
      .arrow-ret  { stroke: #6e7681; stroke-width: 1.5; fill: none; stroke-dasharray: 5 4; }
      .arrow-fill { fill: #6e7681; }
      .sep        { stroke: #6e7681; stroke-width: 0.6; stroke-dasharray: 3 3; }
      .activation { stroke: #6e7681; stroke-width: 0.8; fill: #6e7681; fill-opacity: 0.15; }
    </style>
  </defs>
  <rect class="stroke" x="40" y="24" width="820" height="64" rx="6" ry="6"/>
  <line class="sep" x1="240" y1="32" x2="240" y2="80"/>
  <text x="60" y="52" class="hdr-l">Level 4</text>
  <text x="60" y="70" class="sub-l">qualified signature</text>
  <text x="260" y="52" class="item">eIDAS remote signing service</text>
  <text x="260" y="70" class="sub-l">legally equal to a handwritten signature · high effort</text>
  <rect class="stroke" x="40" y="100" width="820" height="64" rx="6" ry="6"/>
  <line class="sep" x1="240" y1="108" x2="240" y2="156"/>
  <text x="60" y="128" class="hdr-l">Level 3</text>
  <text x="60" y="146" class="sub-l">passkey approval</text>
  <text x="260" y="128" class="item">WebAuthn signs the commit id → refs/notes/approvals</text>
  <text x="260" y="146" class="sub-l">a key on the user's device approved exactly this state</text>
  <rect class="stroke" x="40" y="176" width="820" height="64" rx="6" ry="6"/>
  <line class="sep" x1="240" y1="184" x2="240" y2="232"/>
  <text x="60" y="204" class="hdr-l">Level 2</text>
  <text x="60" y="222" class="sub-l">step-up</text>
  <text x="260" y="204" class="item">level 1 + fresh MFA before the approval (acr / amr)</text>
  <text x="260" y="222" class="sub-l">the user confirmed this very approval with MFA</text>
  <rect class="tint" x="40" y="252" width="820" height="64" rx="6" ry="6"/>
  <line class="sep" x1="240" y1="260" x2="240" y2="308"/>
  <text x="60" y="280" class="hdr-l">Level 1</text>
  <text x="60" y="298" class="sub-l">application signature</text>
  <text x="260" y="280" class="item">signed commit + trailers Actor, Actor-Issuer, Auth-Time, Session</text>
  <text x="260" y="298" class="sub-l">the application confirms the authenticated user · default</text>
  <rect class="stroke" x="40" y="328" width="820" height="64" rx="6" ry="6"/>
  <line class="sep" x1="240" y1="336" x2="240" y2="384"/>
  <text x="60" y="356" class="hdr-l">Level 0</text>
  <text x="60" y="374" class="sub-l">author field</text>
  <text x="260" y="356" class="item">unchecked commit metadata</text>
  <text x="260" y="374" class="sub-l">no checked statement</text>
  <text x="450" y="416" class="caption">Each level adds to the one below. Level 1 is the default for every commit; levels 2 and 3 are configured per transition.</text>
</svg>
