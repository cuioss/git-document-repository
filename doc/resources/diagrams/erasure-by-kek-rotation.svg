<?xml version="1.0" encoding="UTF-8"?>
<!--
  Block diagram: four numbered steps left to right, arrows in 40 px gutters,
  one effect box below (block standard, "Pipeline stages"). No track geometry,
  so not a flow diagram.
  theme-handling: A (theme-neutral)
  see pm-documents:ref-svg-diagrams/standards/theme-handling.md
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 412"
     role="img" aria-labelledby="title desc"
     font-family="ui-sans-serif, -apple-system, system-ui, 'Segoe UI', sans-serif">
  <title id="title">Erasure of a person by rotation of the key-encryption key</title>
  <desc  id="desc">Four steps: remove the entry of the pseudonym (its DEKs, issuer and sub) from the keyring; re-encrypt the keyring with a new KEK version n+1, note the older versions as pending destruction and commit it (and push it in remote mode); then, only once that succeeded, destroy every KEK version pending destruction at the key source; finally record each destruction in a further commit. As a result every old keyring version in the history becomes unreadable, the erased person's data keys and with them the person's entry and personal fields are gone, and every other person stays readable. No history is rewritten.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" class="arrow-fill"/>
    </marker>
    <style>
      .hdr        { font-size: 15px; font-weight: 600; fill: #6e7681; text-anchor: middle; }
      .sub        { font-size: 11px; fill: #6e7681; text-anchor: middle; font-style: italic; }
      .caption    { font-size: 11px; fill: #6e7681; text-anchor: middle; font-style: italic; }
      .stroke     { stroke: #6e7681; stroke-width: 1.2; fill: none; }
      .tint       { stroke: #6e7681; stroke-width: 1.2; fill: #6e7681; fill-opacity: 0.08; }
      .arrow      { stroke: #6e7681; stroke-width: 1.5; fill: none; }
      .arrow-fill { fill: #6e7681; }
    </style>
  </defs>
  <rect class="stroke" x="40" y="40" width="200" height="112" rx="6" ry="6"/>
  <text x="140" y="72" class="hdr">1 · remove</text>
  <text x="140" y="96" class="sub">entry of p-x from the keyring</text>
  <text x="140" y="114" class="sub">(its DEKs, issuer and sub)</text>

  <rect class="stroke" x="280" y="40" width="200" height="112" rx="6" ry="6"/>
  <text x="380" y="72" class="hdr">2 · re-encrypt</text>
  <text x="380" y="96" class="sub">keyring with KEK version n+1</text>
  <text x="380" y="114" class="sub">note n as pending destruction</text>
  <text x="380" y="132" class="sub">commit (remote mode: push)</text>

  <rect class="stroke" x="520" y="40" width="200" height="112" rx="6" ry="6"/>
  <text x="620" y="72" class="hdr">3 · destroy</text>
  <text x="620" y="96" class="sub">every KEK version pending</text>
  <text x="620" y="114" class="sub">destruction, only once</text>
  <text x="620" y="132" class="sub">step 2 succeeded</text>

  <rect class="stroke" x="760" y="40" width="200" height="112" rx="6" ry="6"/>
  <text x="860" y="72" class="hdr">4 · record</text>
  <text x="860" y="96" class="sub">the destruction in a further</text>
  <text x="860" y="114" class="sub">commit (remote mode: push)</text>

  <line class="arrow" x1="240" y1="96" x2="278" y2="96" marker-end="url(#arrow)"/>
  <line class="arrow" x1="480" y1="96" x2="518" y2="96" marker-end="url(#arrow)"/>
  <line class="arrow" x1="720" y1="96" x2="758" y2="96" marker-end="url(#arrow)"/>
  <line class="arrow" x1="620" y1="152" x2="620" y2="214" marker-end="url(#arrow)"/>

  <rect class="tint" x="140" y="216" width="720" height="128" rx="6" ry="6"/>
  <text x="500" y="244" class="hdr">Effect</text>
  <text x="500" y="270" class="sub">every old keyring version in the history is unreadable: its KEK is gone</text>
  <text x="500" y="290" class="sub">the DEKs of p-x are gone with it, so persons/p-x.enc and its personal fields are noise</text>
  <text x="500" y="310" class="sub">everyone else stays readable: their DEKs are in the new keyring</text>
  <text x="500" y="330" class="sub">no history is rewritten; the next checkpoint anchors the destruction commit</text>

  <text x="500" y="388" class="caption">Erasures are batched (for example daily); one rotation erases any number of pseudonyms.</text>
</svg>
