<?xml version="1.0" encoding="UTF-8"?>
<!--
  Flow diagram.
  theme-handling: A (theme-neutral)
  see pm-documents:ref-svg-diagrams/standards/theme-handling.md
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 410"
     role="img" aria-labelledby="title desc"
     font-family="ui-sans-serif, -apple-system, system-ui, 'Segoe UI', sans-serif">
  <title id="title">Erasure of a person by rotation of the key-encryption key</title>
  <desc  id="desc">Three steps: remove the entry of the pseudonym from the keyring, re-encrypt the keyring with a new KEK version and commit it (and push it in remote mode), then, only once that succeeded, destroy the old KEK version at the key source. As a result every old keyring version in the history becomes unreadable, the erased person's data key and with it the person's entry and personal fields are gone, and every other person stays readable. No history is rewritten.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" class="arrow-fill"/>
    </marker>
    <style>
      .hdr        { font-size: 15px; font-weight: 600; fill: #6e7681; text-anchor: middle; }
      .hdr-l      { font-size: 15px; font-weight: 600; fill: #6e7681; text-anchor: start; }
      .sub        { font-size: 11px; fill: #6e7681; text-anchor: middle; font-style: italic; }
      .sub-l      { font-size: 11px; fill: #6e7681; text-anchor: start; font-style: italic; }
      .item       { font-size: 12px; fill: #6e7681; font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
      .item-c     { font-size: 12px; fill: #6e7681; font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; text-anchor: middle; }
      .item-b     { font-size: 12px; fill: #6e7681; font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; text-anchor: middle; font-weight: 700; }
      .lbl        { font-size: 11px; fill: #6e7681; text-anchor: middle; font-style: italic; }
      .caption    { font-size: 12px; fill: #6e7681; text-anchor: middle; font-style: italic; }
      .stroke     { stroke: #6e7681; stroke-width: 1.2; fill: none; }
      .stroke-d   { stroke: #6e7681; stroke-width: 1.2; fill: none; stroke-dasharray: 5 4; }
      .tint       { stroke: #6e7681; stroke-width: 1.2; fill: #6e7681; fill-opacity: 0.08; }
      .arrow      { stroke: #6e7681; stroke-width: 1.5; fill: none; }
      .arrow-ret  { stroke: #6e7681; stroke-width: 1.5; fill: none; stroke-dasharray: 5 4; }
      .arrow-fill { fill: #6e7681; }
      .sep        { stroke: #6e7681; stroke-width: 0.6; stroke-dasharray: 3 3; }
      .activation { stroke: #6e7681; stroke-width: 0.8; fill: #6e7681; fill-opacity: 0.15; }
    </style>
  </defs>
  <rect class="stroke" x="30" y="60" width="240" height="96" rx="6" ry="6"/>
  <text x="150" y="92" class="hdr">1 · remove</text>
  <text x="150" y="116" class="sub">entry of p-x from the keyring</text>
  <text x="150" y="134" class="sub">(its DEK, issuer and sub)</text>
  <rect class="stroke" x="330" y="60" width="240" height="96" rx="6" ry="6"/>
  <text x="450" y="92" class="hdr">2 · re-encrypt</text>
  <text x="450" y="116" class="sub">keyring with KEK version n+1</text>
  <text x="450" y="134" class="sub">commit it (remote mode: push it)</text>
  <rect class="stroke" x="630" y="60" width="240" height="96" rx="6" ry="6"/>
  <text x="750" y="92" class="hdr">3 · destroy</text>
  <text x="750" y="116" class="sub">KEK version n, only once</text>
  <text x="750" y="134" class="sub">step 2 succeeded</text>
  <line class="arrow" x1="270" y1="108" x2="328" y2="108" marker-end="url(#arrow)"/>
  <line class="arrow" x1="570" y1="108" x2="628" y2="108" marker-end="url(#arrow)"/>
  <line class="arrow" x1="750" y1="156" x2="750" y2="214" marker-end="url(#arrow)"/>
  <rect class="tint" x="90" y="216" width="720" height="128" rx="6" ry="6"/>
  <text x="450" y="244" class="hdr">Effect</text>
  <text x="450" y="270" class="sub">every old keyring version in the history is unreadable: its KEK is gone</text>
  <text x="450" y="290" class="sub">the DEK of p-x is gone with it, so persons/p-x.enc and its personal fields are noise</text>
  <text x="450" y="310" class="sub">everyone else stays readable: their DEKs are in the new keyring</text>
  <text x="450" y="330" class="sub">no history is rewritten; the evidence commit is timestamped like every state of main</text>
  <text x="450" y="390" class="caption">Erasures are batched (for example daily); one rotation erases any number of pseudonyms.</text>
</svg>
