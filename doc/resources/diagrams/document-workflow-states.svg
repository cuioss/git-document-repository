<?xml version="1.0" encoding="UTF-8"?>
<!--
  State diagram.
  theme-handling: A (theme-neutral)
  see pm-documents:ref-svg-diagrams/standards/theme-handling.md
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 376"
     role="img" aria-labelledby="title desc"
     font-family="ui-sans-serif, -apple-system, system-ui, 'Segoe UI', sans-serif">
  <title id="title">Workflow states of a schema-driven document</title>
  <desc  id="desc">Four states in a row. A document is created as draft and edited by intermediate saves on the user's draft reference. Submit moves it to review on the working branch. Approve releases it, with step-up as every release to main with a tag; every commit is signed by the application. Rework returns a document from review to draft; revise starts the next version of an approved document as draft. Supersede, with step-up, withdraws an approved document; the earlier tags stay.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" class="arrow-fill"/>
    </marker>
    <style>
      .hdr        { font-size: 15px; font-weight: 600; fill: #6e7681; text-anchor: middle; }
      .hdr-l      { font-size: 15px; font-weight: 600; fill: #6e7681; text-anchor: start; }
      .sub        { font-size: 11px; fill: #6e7681; text-anchor: middle; font-style: italic; }
      .sub-l      { font-size: 11px; fill: #6e7681; text-anchor: start; font-style: italic; }
      .item       { font-size: 12px; fill: #6e7681; font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
      .item-c     { font-size: 12px; fill: #6e7681; font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; text-anchor: middle; }
      .item-b     { font-size: 12px; fill: #6e7681; font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; text-anchor: middle; font-weight: 700; }
      .lbl        { font-size: 11px; fill: #6e7681; text-anchor: middle; font-style: italic; }
      .caption    { font-size: 11px; fill: #6e7681; text-anchor: middle; font-style: italic; }
      .stroke     { stroke: #6e7681; stroke-width: 1.2; fill: none; }
      .stroke-d   { stroke: #6e7681; stroke-width: 1.2; fill: none; stroke-dasharray: 5 4; }
      .tint       { stroke: #6e7681; stroke-width: 1.2; fill: #6e7681; fill-opacity: 0.08; }
      .arrow      { stroke: #6e7681; stroke-width: 1.5; fill: none; }
      .arrow-fill { fill: #6e7681; }
      .sep        { stroke: #6e7681; stroke-width: 0.6; stroke-dasharray: 3 3; }
    </style>
  </defs>
  <rect class="stroke" x="100" y="160" width="120" height="60" rx="8" ry="8"/>
  <text x="160" y="186" class="hdr">draft</text>
  <text x="160" y="206" class="sub">refs/drafts/…</text>
  <rect class="stroke" x="300" y="160" width="120" height="60" rx="8" ry="8"/>
  <text x="360" y="186" class="hdr">review</text>
  <text x="360" y="206" class="sub">working branch</text>
  <rect class="stroke" x="500" y="160" width="120" height="60" rx="8" ry="8"/>
  <text x="560" y="186" class="hdr">approved</text>
  <text x="560" y="206" class="sub">main + tag</text>
  <rect class="stroke" x="700" y="160" width="120" height="60" rx="8" ry="8"/>
  <text x="760" y="186" class="hdr">superseded</text>
  <text x="760" y="206" class="sub">earlier tags stay</text>
  <circle cx="40" cy="180" r="7" class="arrow-fill"/>
  <line class="arrow" x1="47" y1="180" x2="98" y2="180" marker-end="url(#arrow)"/>
  <text x="72" y="172" class="lbl">create</text>
  <line class="arrow" x1="220" y1="180" x2="298" y2="180" marker-end="url(#arrow)"/>
  <text x="260" y="172" class="lbl">submit</text>
  <line class="arrow" x1="420" y1="180" x2="498" y2="180" marker-end="url(#arrow)"/>
  <text x="460" y="172" class="lbl">approve</text>
  <text x="460" y="200" class="lbl">step-up</text>
  <line class="arrow" x1="620" y1="180" x2="698" y2="180" marker-end="url(#arrow)"/>
  <text x="660" y="172" class="lbl">supersede</text>
  <text x="660" y="200" class="lbl">step-up</text>
  <path class="arrow" d="M360,220 Q260,290 162,222" marker-end="url(#arrow)"/>
  <text x="260" y="272" class="lbl">rework</text>
  <path class="arrow" d="M140,160 Q160,100 180,158" marker-end="url(#arrow)"/>
  <text x="160" y="120" class="lbl">edit (intermediate save)</text>
  <path class="arrow" d="M560,160 Q385,70 206,158" marker-end="url(#arrow)"/>
  <text x="385" y="104" class="lbl">revise</text>
  <text x="450" y="40" class="hdr">Default workflow of a document</text>
  <text x="450" y="60" class="sub">each transition maps onto a store mechanism; every commit is signed, every release requires step-up</text>
  <text x="450" y="352" class="caption">Deadlines are declared per state, for example a review within 14 days or a yearly review of an approved document.</text>
</svg>
