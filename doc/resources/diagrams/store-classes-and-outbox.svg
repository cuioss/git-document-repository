<?xml version="1.0" encoding="UTF-8"?>
<!--
  Block diagram: Git / outbox / three store classes. The dashed box and the dashed
  edge mean "referenced only, never fed" (stated in the box and the caption).
  theme-handling: A (theme-neutral)
  see pm-documents:ref-svg-diagrams/standards/theme-handling.md
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 424"
     role="img" aria-labelledby="title desc"
     font-family="ui-sans-serif, -apple-system, system-ui, 'Segoe UI', sans-serif">
  <title id="title">Git, the post-commit outbox and the three classes of companion stores</title>
  <desc  id="desc">Git holds documents, registers, the directory, approval trailers, notes for approvals and timestamps, and the outbox progress references. After every reference update, successful push or fetch that moves a subscribed branch, the outbox walks the new commits of that branch oldest first, idempotently by commit hash, and feeds the derived store (the in-memory index, read by search and dashboards; volatile and rebuildable) and the assuring stores (RFC 3161 timestamps and an optional mirror). Complementary systems such as the identity provider, ticket system, Vault or KMS and the SIEM are only referenced by id and never fed with Git content; they and the reference edge are drawn dashed.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" class="arrow-fill"/>
    </marker>
    <style>
      .hdr        { font-size: 15px; font-weight: 600; fill: #6e7681; text-anchor: middle; }
      .hdr-l      { font-size: 15px; font-weight: 600; fill: #6e7681; text-anchor: start; }
      .sub        { font-size: 11px; fill: #6e7681; text-anchor: middle; font-style: italic; }
      .sub-l      { font-size: 11px; fill: #6e7681; text-anchor: start; font-style: italic; }
      .item       { font-size: 12px; fill: #6e7681; font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
      .item-c     { font-size: 12px; fill: #6e7681; font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; text-anchor: middle; }
      .item-b     { font-size: 12px; fill: #6e7681; font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; text-anchor: middle; font-weight: 700; }
      .lbl        { font-size: 11px; fill: #6e7681; text-anchor: middle; font-style: italic; }
      .caption    { font-size: 11px; fill: #6e7681; text-anchor: middle; font-style: italic; }
      .stroke     { stroke: #6e7681; stroke-width: 1.2; fill: none; }
      .stroke-d   { stroke: #6e7681; stroke-width: 1.2; fill: none; stroke-dasharray: 5 4; }
      .tint       { stroke: #6e7681; stroke-width: 1.2; fill: #6e7681; fill-opacity: 0.08; }
      .arrow      { stroke: #6e7681; stroke-width: 1.5; fill: none; }
      .ref-edge   { stroke: #6e7681; stroke-width: 1.5; fill: none; stroke-dasharray: 5 4; }
      .arrow-fill { fill: #6e7681; }
      .sep        { stroke: #6e7681; stroke-width: 0.6; stroke-dasharray: 3 3; }
    </style>
  </defs>
  <text x="150" y="32" class="hdr">Git</text>
  <text x="150" y="50" class="sub">the source of truth</text>
  <rect class="tint" x="40" y="64" width="220" height="300" rx="6" ry="6"/>
  <text x="150" y="104" class="item-c">documents</text>
  <text x="150" y="134" class="item-c">registers</text>
  <text x="150" y="164" class="item-c">directory</text>
  <text x="150" y="194" class="item-c">approval trailers</text>
  <text x="150" y="224" class="item-c">notes: approvals</text>
  <text x="150" y="254" class="item-c">notes: timestamps</text>
  <text x="150" y="284" class="item-c">refs/meta/outbox/*</text>
  <text x="400" y="32" class="hdr">Outbox</text>
  <text x="400" y="50" class="sub">after every save, push or moving fetch</text>
  <rect class="stroke" x="310" y="64" width="180" height="140" rx="6" ry="6"/>
  <text x="400" y="100" class="sub">walks the new commits</text>
  <text x="400" y="120" class="sub">oldest first, per branch</text>
  <text x="400" y="140" class="sub">idempotent by commit hash</text>
  <text x="400" y="160" class="sub">progress kept in references</text>
  <text x="400" y="180" class="sub">resumes after a failure</text>
  <line class="arrow" x1="260" y1="134" x2="308" y2="134" marker-end="url(#arrow)"/>
  <rect class="stroke" x="560" y="64" width="300" height="88" rx="6" ry="6"/>
  <text x="710" y="92" class="hdr">derived</text>
  <text x="710" y="114" class="item-c">in-memory index</text>
  <text x="710" y="134" class="sub">volatile, rebuildable; search and dashboards read it</text>
  <rect class="stroke" x="560" y="168" width="300" height="88" rx="6" ry="6"/>
  <text x="710" y="196" class="hdr">assuring</text>
  <text x="710" y="218" class="item-c">RFC 3161 timestamps · mirror</text>
  <text x="710" y="238" class="sub">outside the Git administrator's control</text>
  <rect class="stroke-d" x="560" y="272" width="300" height="88" rx="6" ry="6"/>
  <text x="710" y="300" class="hdr">complementary</text>
  <text x="710" y="322" class="item-c">IdP · tickets · Vault/KMS · SIEM</text>
  <text x="710" y="342" class="sub">referenced by id, never fed with Git content</text>
  <line class="arrow" x1="490" y1="108" x2="558" y2="108" marker-end="url(#arrow)"/>
  <text x="524" y="100" class="lbl">rebuild</text>
  <line class="arrow" x1="490" y1="176" x2="558" y2="206" marker-end="url(#arrow)"/>
  <text x="536" y="182" class="lbl">anchor</text>
  <path class="ref-edge" d="M260,330 L558,330" marker-end="url(#arrow)"/>
  <text x="410" y="322" class="lbl">references only (incident: TICKET-4711)</text>
  <text x="450" y="400" class="caption">Git first; everything else follows from it or is referenced by it. Dashed: referenced only. No store beside Git holds truth.</text>
</svg>
