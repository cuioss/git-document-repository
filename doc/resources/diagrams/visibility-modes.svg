<?xml version="1.0" encoding="UTF-8"?>
<!--
  Block diagram.
  theme-handling: A (theme-neutral)
  see pm-documents:ref-svg-diagrams/standards/theme-handling.md
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470"
     role="img" aria-labelledby="title desc"
     font-family="ui-sans-serif, -apple-system, system-ui, 'Segoe UI', sans-serif">
  <title id="title">Two visibility modes: save often or private until submitted</title>
  <desc  id="desc">Two columns with the same three references: a draft reference per editor that is never pushed, the shared working branch of the document, and main with a release tag. In mode A every explicit save moves small commits from the draft onto the working branch, so other editors see each save at once. In mode B the user saves once on submit, merged in core, so others see the changes only after submit. In both modes the release merges the working branch into main and tags it.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" class="arrow-fill"/>
    </marker>
    <style>
      .hdr        { font-size: 15px; font-weight: 600; fill: #6e7681; text-anchor: middle; }
      .hdr-l      { font-size: 15px; font-weight: 600; fill: #6e7681; text-anchor: start; }
      .sub        { font-size: 11px; fill: #6e7681; text-anchor: middle; font-style: italic; }
      .sub-l      { font-size: 11px; fill: #6e7681; text-anchor: start; font-style: italic; }
      .item       { font-size: 12px; fill: #6e7681; font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
      .item-c     { font-size: 12px; fill: #6e7681; font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; text-anchor: middle; }
      .item-b     { font-size: 12px; fill: #6e7681; font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; text-anchor: middle; font-weight: 700; }
      .lbl        { font-size: 11px; fill: #6e7681; text-anchor: middle; font-style: italic; }
      .caption    { font-size: 12px; fill: #6e7681; text-anchor: middle; font-style: italic; }
      .stroke     { stroke: #6e7681; stroke-width: 1.2; fill: none; }
      .stroke-d   { stroke: #6e7681; stroke-width: 1.2; fill: none; stroke-dasharray: 5 4; }
      .tint       { stroke: #6e7681; stroke-width: 1.2; fill: #6e7681; fill-opacity: 0.08; }
      .arrow      { stroke: #6e7681; stroke-width: 1.5; fill: none; }
      .arrow-ret  { stroke: #6e7681; stroke-width: 1.5; fill: none; stroke-dasharray: 5 4; }
      .arrow-fill { fill: #6e7681; }
      .sep        { stroke: #6e7681; stroke-width: 0.6; stroke-dasharray: 3 3; }
      .activation { stroke: #6e7681; stroke-width: 0.8; fill: #6e7681; fill-opacity: 0.15; }
    </style>
  </defs>
  <text x="225" y="32" class="hdr">A: save often</text>
  <text x="225" y="50" class="sub">joint editing, workshops</text>
  <rect class="stroke" x="20" y="64" width="410" height="356" rx="6" ry="6"/>
  <rect class="tint" x="95" y="88" width="260" height="48" rx="4" ry="4"/>
  <text x="225" y="108" class="item-c">refs/drafts/&lt;user&gt;/&lt;doc&gt;</text>
  <text x="225" y="126" class="sub">one per editor, never pushed</text>
  <line class="arrow" x1="225" y1="136" x2="225" y2="204" marker-end="url(#arrow)"/>
  <text x="237" y="164" class="sub-l">every explicit save,</text>
  <text x="237" y="180" class="sub-l">small commits</text>
  <rect class="tint" x="95" y="206" width="260" height="48" rx="4" ry="4"/>
  <text x="225" y="226" class="item-c">refs/heads/&lt;collection&gt;/&lt;id&gt;</text>
  <text x="225" y="244" class="sub">shared working branch</text>
  <line class="arrow" x1="225" y1="254" x2="225" y2="322" marker-end="url(#arrow)"/>
  <text x="237" y="290" class="sub-l">release: merge + tag</text>
  <rect class="tint" x="95" y="324" width="260" height="48" rx="4" ry="4"/>
  <text x="225" y="344" class="item-c">main + tag &lt;collection&gt;/&lt;id&gt;</text>
  <text x="225" y="362" class="sub">immutable through protection</text>
  <text x="225" y="400" class="sub">others see each save at once</text>
  <text x="675" y="32" class="hdr">B: private until submitted</text>
  <text x="675" y="50" class="sub">longer individual work</text>
  <rect class="stroke" x="470" y="64" width="410" height="356" rx="6" ry="6"/>
  <rect class="tint" x="545" y="88" width="260" height="48" rx="4" ry="4"/>
  <text x="675" y="108" class="item-c">refs/drafts/&lt;user&gt;/&lt;doc&gt;</text>
  <text x="675" y="126" class="sub">one per editor, never pushed</text>
  <line class="arrow" x1="675" y1="136" x2="675" y2="204" marker-end="url(#arrow)"/>
  <text x="687" y="164" class="sub-l">one save on submit,</text>
  <text x="687" y="180" class="sub-l">merged in core</text>
  <rect class="tint" x="545" y="206" width="260" height="48" rx="4" ry="4"/>
  <text x="675" y="226" class="item-c">refs/heads/&lt;collection&gt;/&lt;id&gt;</text>
  <text x="675" y="244" class="sub">shared working branch</text>
  <line class="arrow" x1="675" y1="254" x2="675" y2="322" marker-end="url(#arrow)"/>
  <text x="687" y="290" class="sub-l">release: merge + tag</text>
  <rect class="tint" x="545" y="324" width="260" height="48" rx="4" ry="4"/>
  <text x="675" y="344" class="item-c">main + tag &lt;collection&gt;/&lt;id&gt;</text>
  <text x="675" y="362" class="sub">immutable through protection</text>
  <text x="675" y="400" class="sub">others see it after submit</text>
  <text x="450" y="452" class="caption">Both modes use the same references; they differ only in how often a draft is saved onto the working branch.</text>
</svg>
