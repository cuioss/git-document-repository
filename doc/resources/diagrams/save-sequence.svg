<?xml version="1.0" encoding="UTF-8"?>
<!--
  Sequence diagram: four actors with header label above a box carrying a sub-label,
  dashed lifelines, solid requests, dashed returns, activation bar on git-store.
  Dotted frames (0.6 px, 3 3) mark the loop and the optional step.
  theme-handling: A (theme-neutral)
  see pm-documents:ref-svg-diagrams/standards/theme-handling.md
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 624"
     role="img" aria-labelledby="title desc"
     font-family="ui-sans-serif, -apple-system, system-ui, 'Segoe UI', sans-serif">
  <title id="title">Sequence of an explicit save in remote mode</title>
  <desc  id="desc">The application asks git-store to save a draft. git-store applies the draft's changes onto the tip of the working branch as one commit whose only parent is that tip (squash merge in core) and moves the working branch by compare-and-swap; if the branch moved meanwhile it re-applies the operation. In a loop in remote mode it fetches the working branch from the remote Git server: on a moved remote it resets the local branch to the fetched tip and re-applies; a path changed concurrently (expectedBlobId) ends the save with a conflict. It then pushes with lease and repeats on rejection until the push is accepted or save.max-attempts is reached. Only when the save succeeded does it delete the draft reference, by compare-and-delete, so a newer draft commit stays. It returns saved, conflict, rejected or credentials expired. On conflict nothing is pushed, the draft reference is kept and the local working branch is not moved. In local mode the loop is absent.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" class="arrow-fill"/>
    </marker>
    <style>
      .col-header   { font-size: 15px; font-weight: 600; fill: #6e7681; text-anchor: middle; }
      .col-sub      { font-size: 11px; fill: #6e7681; text-anchor: middle; font-style: italic; }
      .arrow-lbl    { font-size: 11px; fill: #6e7681; text-anchor: middle; font-style: italic; }
      .note-lbl     { font-size: 11px; fill: #6e7681; font-style: italic; }
      .caption      { font-size: 11px; fill: #6e7681; text-anchor: middle; font-style: italic; }
      .stroke       { stroke: #6e7681; stroke-width: 1.2; fill: none; }
      .sep          { stroke: #6e7681; stroke-width: 0.6; stroke-dasharray: 3 3; fill: none; }
      .arrow        { stroke: #6e7681; stroke-width: 1.5; fill: none; }
      .arrow-return { stroke: #6e7681; stroke-width: 1.5; fill: none; stroke-dasharray: 5 4; }
      .arrow-fill   { fill: #6e7681; }
      .activation   { stroke: #6e7681; stroke-width: 0.8; fill: #6e7681; fill-opacity: 0.15; }
    </style>
  </defs>

  <!-- actors and lifelines -->
  <text x="100" y="30" class="col-header">application</text>
  <rect class="stroke" x="24" y="42" width="152" height="36" rx="6"/>
  <text x="100" y="64" class="col-sub">caller</text>
  <line class="sep" x1="100" y1="78" x2="100" y2="576"/>

  <text x="380" y="30" class="col-header">git-store</text>
  <rect class="stroke" x="304" y="42" width="152" height="36" rx="6"/>
  <text x="380" y="64" class="col-sub">save operation</text>
  <line class="sep" x1="380" y1="78" x2="380" y2="576"/>

  <text x="610" y="30" class="col-header">local repository</text>
  <rect class="stroke" x="534" y="42" width="152" height="36" rx="6"/>
  <text x="610" y="64" class="col-sub">bare, in core</text>
  <line class="sep" x1="610" y1="78" x2="610" y2="576"/>

  <text x="820" y="30" class="col-header">Git server</text>
  <rect class="stroke" x="744" y="42" width="152" height="36" rx="6"/>
  <text x="820" y="64" class="col-sub">remote</text>
  <line class="sep" x1="820" y1="78" x2="820" y2="576"/>

  <!-- activation -->
  <rect class="activation" x="375" y="112" width="10" height="444"/>

  <!-- save -->
  <line class="arrow" x1="100" y1="112" x2="375" y2="112" marker-end="url(#arrow)"/>
  <text x="237" y="104" class="arrow-lbl">save(draft)</text>

  <line class="arrow" x1="385" y1="148" x2="610" y2="148" marker-end="url(#arrow)"/>
  <text x="497" y="140" class="arrow-lbl">squash merge in core onto the tip</text>
  <line class="arrow-return" x1="610" y1="176" x2="385" y2="176" marker-end="url(#arrow)"/>
  <text x="497" y="168" class="arrow-lbl">commit, only parent = the tip</text>

  <line class="arrow" x1="385" y1="208" x2="610" y2="208" marker-end="url(#arrow)"/>
  <text x="497" y="200" class="arrow-lbl">compare-and-swap working branch</text>
  <line class="arrow-return" x1="610" y1="236" x2="385" y2="236" marker-end="url(#arrow)"/>
  <text x="497" y="228" class="arrow-lbl">moved | stale: re-apply</text>

  <!-- loop, remote mode -->
  <rect class="sep" x="340" y="256" width="544" height="180" rx="4" ry="4"/>
  <text x="394" y="274" class="note-lbl">loop [remote mode] until accepted or save.max-attempts</text>
  <line class="arrow" x1="385" y1="304" x2="820" y2="304" marker-end="url(#arrow)"/>
  <text x="602" y="296" class="arrow-lbl">fetch working branch</text>
  <line class="arrow-return" x1="820" y1="332" x2="385" y2="332" marker-end="url(#arrow)"/>
  <text x="602" y="324" class="arrow-lbl">remote tip</text>
  <text x="394" y="358" class="note-lbl">moved remote: reset to the fetched tip, re-apply · changed path: conflict, stop</text>
  <line class="arrow" x1="385" y1="388" x2="820" y2="388" marker-end="url(#arrow)"/>
  <text x="602" y="380" class="arrow-lbl">push with lease</text>
  <line class="arrow-return" x1="820" y1="416" x2="385" y2="416" marker-end="url(#arrow)"/>
  <text x="602" y="408" class="arrow-lbl">accepted | rejected</text>

  <!-- only on saved -->
  <rect class="sep" x="340" y="450" width="544" height="66" rx="4" ry="4"/>
  <text x="394" y="468" class="note-lbl">opt [saved]</text>
  <line class="arrow" x1="385" y1="498" x2="610" y2="498" marker-end="url(#arrow)"/>
  <text x="497" y="490" class="arrow-lbl">compare-and-delete draft reference</text>

  <!-- result -->
  <line class="arrow-return" x1="375" y1="548" x2="100" y2="548" marker-end="url(#arrow)"/>
  <text x="237" y="540" class="arrow-lbl">saved | conflict | rejected | credentials expired</text>

  <text x="460" y="604" class="caption">In local mode the loop is absent. On conflict nothing is pushed, the draft reference is kept and the local branch is not moved.</text>
</svg>
