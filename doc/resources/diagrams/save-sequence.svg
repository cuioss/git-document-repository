<?xml version="1.0" encoding="UTF-8"?>
<!--
  Sequence diagram: four actors with header label above a box carrying a sub-label,
  dashed lifelines, solid requests, dashed returns, activation bar on git-store.
  Dotted frames (0.6 px, 3 3) mark the loop and the optional step.
  theme-handling: A (theme-neutral)
  see pm-documents:ref-svg-diagrams/standards/theme-handling.md
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 580"
     role="img" aria-labelledby="title desc"
     font-family="ui-sans-serif, -apple-system, system-ui, 'Segoe UI', sans-serif">
  <title id="title">Sequence of an explicit save</title>
  <desc  id="desc">The application asks git-store to save a draft. In a loop, git-store fetches the working branch from the Git server; an unreachable server ends the save as unreachable and the draft keeps the work. It applies the draft's changes onto the fetched remote tip as one commit whose only parent is that tip (squash merge in core); a path changed concurrently (expectedBlobId) ends the save with a conflict. It pushes with lease and repeats from the fetch on rejection until the push is accepted or save.max-attempts is reached. Only after the accepted push does it move the local working branch to the new commit and delete the draft reference by compare-and-delete, so a newer draft commit stays. It returns saved, conflict, rejected, unreachable or credentials expired. On any other outcome nothing is pushed and the draft reference and the working branch are unchanged.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" class="arrow-fill"/>
    </marker>
    <style>
      .col-header   { font-size: 15px; font-weight: 600; fill: #6e7681; text-anchor: middle; }
      .col-sub      { font-size: 11px; fill: #6e7681; text-anchor: middle; font-style: italic; }
      .arrow-lbl    { font-size: 11px; fill: #6e7681; text-anchor: middle; font-style: italic; }
      .note-lbl     { font-size: 11px; fill: #6e7681; font-style: italic; }
      .caption      { font-size: 11px; fill: #6e7681; text-anchor: middle; font-style: italic; }
      .stroke       { stroke: #6e7681; stroke-width: 1.2; fill: none; }
      .sep          { stroke: #6e7681; stroke-width: 0.6; stroke-dasharray: 3 3; fill: none; }
      .arrow        { stroke: #6e7681; stroke-width: 1.5; fill: none; }
      .arrow-return { stroke: #6e7681; stroke-width: 1.5; fill: none; stroke-dasharray: 5 4; }
      .arrow-fill   { fill: #6e7681; }
      .activation   { stroke: #6e7681; stroke-width: 0.8; fill: #6e7681; fill-opacity: 0.15; }
    </style>
  </defs>

  <!-- actors and lifelines -->
  <text x="100" y="30" class="col-header">application</text>
  <rect class="stroke" x="24" y="42" width="152" height="36" rx="6"/>
  <text x="100" y="64" class="col-sub">caller</text>
  <line class="sep" x1="100" y1="78" x2="100" y2="530"/>

  <text x="380" y="30" class="col-header">git-store</text>
  <rect class="stroke" x="304" y="42" width="152" height="36" rx="6"/>
  <text x="380" y="64" class="col-sub">save operation</text>
  <line class="sep" x1="380" y1="78" x2="380" y2="530"/>

  <text x="610" y="30" class="col-header">local clone</text>
  <rect class="stroke" x="534" y="42" width="152" height="36" rx="6"/>
  <text x="610" y="64" class="col-sub">bare, in core</text>
  <line class="sep" x1="610" y1="78" x2="610" y2="530"/>

  <text x="820" y="30" class="col-header">Git server</text>
  <rect class="stroke" x="744" y="42" width="152" height="36" rx="6"/>
  <text x="820" y="64" class="col-sub">remote</text>
  <line class="sep" x1="820" y1="78" x2="820" y2="530"/>

  <!-- activation -->
  <rect class="activation" x="375" y="112" width="10" height="398"/>

  <!-- save -->
  <line class="arrow" x1="100" y1="112" x2="375" y2="112" marker-end="url(#arrow)"/>
  <text x="237" y="104" class="arrow-lbl">save(draft)</text>

  <!-- loop -->
  <rect class="sep" x="340" y="130" width="544" height="234" rx="4" ry="4"/>
  <text x="394" y="148" class="note-lbl">loop until accepted or save.max-attempts</text>
  <line class="arrow" x1="385" y1="178" x2="820" y2="178" marker-end="url(#arrow)"/>
  <text x="602" y="170" class="arrow-lbl">fetch working branch</text>
  <line class="arrow-return" x1="820" y1="206" x2="385" y2="206" marker-end="url(#arrow)"/>
  <text x="602" y="198" class="arrow-lbl">remote tip</text>
  <line class="arrow" x1="385" y1="240" x2="610" y2="240" marker-end="url(#arrow)"/>
  <text x="497" y="232" class="arrow-lbl">squash merge in core onto the remote tip</text>
  <line class="arrow-return" x1="610" y1="268" x2="385" y2="268" marker-end="url(#arrow)"/>
  <text x="497" y="260" class="arrow-lbl">commit, only parent = the tip</text>
  <text x="394" y="290" class="note-lbl">changed path: conflict, stop · unreachable: stop, the draft keeps the work</text>
  <line class="arrow" x1="385" y1="322" x2="820" y2="322" marker-end="url(#arrow)"/>
  <text x="602" y="314" class="arrow-lbl">push with lease</text>
  <line class="arrow-return" x1="820" y1="350" x2="385" y2="350" marker-end="url(#arrow)"/>
  <text x="602" y="342" class="arrow-lbl">accepted | rejected</text>

  <!-- only on saved -->
  <rect class="sep" x="340" y="378" width="544" height="96" rx="4" ry="4"/>
  <text x="394" y="396" class="note-lbl">opt [saved]</text>
  <line class="arrow" x1="385" y1="428" x2="610" y2="428" marker-end="url(#arrow)"/>
  <text x="497" y="420" class="arrow-lbl">move working branch to the commit</text>
  <line class="arrow" x1="385" y1="460" x2="610" y2="460" marker-end="url(#arrow)"/>
  <text x="497" y="452" class="arrow-lbl">compare-and-delete draft reference</text>

  <!-- result -->
  <line class="arrow-return" x1="375" y1="506" x2="100" y2="506" marker-end="url(#arrow)"/>
  <text x="237" y="484" class="arrow-lbl">saved | conflict | rejected</text>
  <text x="237" y="498" class="arrow-lbl">unreachable | credentials expired</text>

  <text x="460" y="560" class="caption">Unless saved, nothing is pushed, and the draft reference and the working branch are unchanged.</text>
</svg>
