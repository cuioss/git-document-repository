<?xml version="1.0" encoding="UTF-8"?>
<!--
  Sequence diagram.
  theme-handling: A (theme-neutral)
  see pm-documents:ref-svg-diagrams/standards/theme-handling.md
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"
     role="img" aria-labelledby="title desc"
     font-family="ui-sans-serif, -apple-system, system-ui, 'Segoe UI', sans-serif">
  <title id="title">Sequence of an explicit save in remote mode</title>
  <desc  id="desc">The application asks git-store to save a draft. git-store merges the draft in core in the local repository and moves the working branch by compare-and-swap. In a loop it fetches the working branch from the remote Git server and pushes with lease; on rejection it merges onto the remote state and repeats until the push is accepted or the configured number of attempts is reached. It then deletes the draft reference and returns saved, conflict, rejected or credentials expired.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" class="arrow-fill"/>
    </marker>
    <style>
      .hdr        { font-size: 15px; font-weight: 600; fill: #6e7681; text-anchor: middle; }
      .hdr-l      { font-size: 15px; font-weight: 600; fill: #6e7681; text-anchor: start; }
      .sub        { font-size: 11px; fill: #6e7681; text-anchor: middle; font-style: italic; }
      .sub-l      { font-size: 11px; fill: #6e7681; text-anchor: start; font-style: italic; }
      .item       { font-size: 12px; fill: #6e7681; font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
      .item-c     { font-size: 12px; fill: #6e7681; font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; text-anchor: middle; }
      .item-b     { font-size: 12px; fill: #6e7681; font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; text-anchor: middle; font-weight: 700; }
      .lbl        { font-size: 11px; fill: #6e7681; text-anchor: middle; font-style: italic; }
      .caption    { font-size: 12px; fill: #6e7681; text-anchor: middle; font-style: italic; }
      .stroke     { stroke: #6e7681; stroke-width: 1.2; fill: none; }
      .stroke-d   { stroke: #6e7681; stroke-width: 1.2; fill: none; stroke-dasharray: 5 4; }
      .tint       { stroke: #6e7681; stroke-width: 1.2; fill: #6e7681; fill-opacity: 0.08; }
      .arrow      { stroke: #6e7681; stroke-width: 1.5; fill: none; }
      .arrow-ret  { stroke: #6e7681; stroke-width: 1.5; fill: none; stroke-dasharray: 5 4; }
      .arrow-fill { fill: #6e7681; }
      .sep        { stroke: #6e7681; stroke-width: 0.6; stroke-dasharray: 3 3; }
      .activation { stroke: #6e7681; stroke-width: 0.8; fill: #6e7681; fill-opacity: 0.15; }
    </style>
  </defs>
  <rect class="stroke" x="20" y="30" width="160" height="36" rx="6" ry="6"/>
  <text x="100" y="53" class="item-c">application</text>
  <line class="sep" x1="100" y1="66" x2="100" y2="490"/>
  <rect class="stroke" x="320" y="30" width="160" height="36" rx="6" ry="6"/>
  <text x="400" y="53" class="item-c">git-store</text>
  <line class="sep" x1="400" y1="66" x2="400" y2="490"/>
  <rect class="stroke" x="540" y="30" width="160" height="36" rx="6" ry="6"/>
  <text x="620" y="53" class="item-c">local repository</text>
  <line class="sep" x1="620" y1="66" x2="620" y2="490"/>
  <rect class="stroke" x="730" y="30" width="160" height="36" rx="6" ry="6"/>
  <text x="810" y="53" class="item-c">remote Git server</text>
  <line class="sep" x1="810" y1="66" x2="810" y2="490"/>
  <rect class="activation" x="395" y="104" width="10" height="356"/>
  <line class="arrow" x1="100" y1="104" x2="395" y2="104" marker-end="url(#arrow)"/>
  <text x="247.5" y="96" class="lbl">save(draft)</text>
  <line class="arrow" x1="405" y1="140" x2="620" y2="140" marker-end="url(#arrow)"/>
  <text x="512.5" y="132" class="lbl">merge draft in core</text>
  <line class="arrow-ret" x1="620" y1="168" x2="405" y2="168" marker-end="url(#arrow)"/>
  <text x="512.5" y="160" class="lbl">merged tree</text>
  <line class="arrow" x1="405" y1="200" x2="620" y2="200" marker-end="url(#arrow)"/>
  <text x="512.5" y="192" class="lbl">compare-and-swap branch</text>
  <line class="arrow-ret" x1="620" y1="228" x2="405" y2="228" marker-end="url(#arrow)"/>
  <text x="512.5" y="220" class="lbl">moved</text>
  <rect class="sep" x="360" y="246" width="530" height="146" rx="4" ry="4" fill="none"/>
  <text x="414" y="262" class="sub-l">loop: on rejection merge onto the remote state; until accepted or save.max-attempts</text>
  <line class="arrow" x1="405" y1="292" x2="810" y2="292" marker-end="url(#arrow)"/>
  <text x="607.5" y="284" class="lbl">fetch working branch</text>
  <line class="arrow-ret" x1="810" y1="320" x2="405" y2="320" marker-end="url(#arrow)"/>
  <text x="607.5" y="312" class="lbl">remote state</text>
  <line class="arrow" x1="405" y1="348" x2="810" y2="348" marker-end="url(#arrow)"/>
  <text x="607.5" y="340" class="lbl">push with lease</text>
  <line class="arrow-ret" x1="810" y1="376" x2="405" y2="376" marker-end="url(#arrow)"/>
  <text x="607.5" y="368" class="lbl">accepted | rejected</text>
  <line class="arrow" x1="405" y1="420" x2="620" y2="420" marker-end="url(#arrow)"/>
  <text x="512.5" y="412" class="lbl">delete draft reference</text>
  <line class="arrow-ret" x1="395" y1="456" x2="100" y2="456" marker-end="url(#arrow)"/>
  <text x="247.5" y="448" class="lbl">saved | conflict | rejected | credentials expired</text>
  <text x="450" y="520" class="caption">Remote mode. In local mode the loop is absent; the compare-and-swap alone completes the save.</text>
</svg>
