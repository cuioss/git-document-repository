<?xml version="1.0" encoding="UTF-8"?>
<!--
  Graph diagram.
  theme-handling: A (theme-neutral)
  see pm-documents:ref-svg-diagrams/standards/theme-handling.md
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500"
     role="img" aria-labelledby="title desc"
     font-family="ui-sans-serif, -apple-system, system-ui, 'Segoe UI', sans-serif">
  <title id="title">Module dependency graph of git-document-repository</title>
  <desc  id="desc">Nine modules in layers. git-worktrees and git-store depend on git-core. git-forms, git-crypto, git-signing and git-timestamp depend on git-store. git-directory depends on git-forms and git-crypto. git-testing depends on no module of the reactor and is consumed in test scope.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" class="arrow-fill"/>
    </marker>
    <style>
      .hdr        { font-size: 15px; font-weight: 600; fill: #6e7681; text-anchor: middle; }
      .hdr-l      { font-size: 15px; font-weight: 600; fill: #6e7681; text-anchor: start; }
      .sub        { font-size: 11px; fill: #6e7681; text-anchor: middle; font-style: italic; }
      .sub-l      { font-size: 11px; fill: #6e7681; text-anchor: start; font-style: italic; }
      .item       { font-size: 12px; fill: #6e7681; font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
      .item-c     { font-size: 12px; fill: #6e7681; font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; text-anchor: middle; }
      .item-b     { font-size: 12px; fill: #6e7681; font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; text-anchor: middle; font-weight: 700; }
      .lbl        { font-size: 11px; fill: #6e7681; text-anchor: middle; font-style: italic; }
      .caption    { font-size: 12px; fill: #6e7681; text-anchor: middle; font-style: italic; }
      .stroke     { stroke: #6e7681; stroke-width: 1.2; fill: none; }
      .stroke-d   { stroke: #6e7681; stroke-width: 1.2; fill: none; stroke-dasharray: 5 4; }
      .tint       { stroke: #6e7681; stroke-width: 1.2; fill: #6e7681; fill-opacity: 0.08; }
      .arrow      { stroke: #6e7681; stroke-width: 1.5; fill: none; }
      .arrow-ret  { stroke: #6e7681; stroke-width: 1.5; fill: none; stroke-dasharray: 5 4; }
      .arrow-fill { fill: #6e7681; }
      .sep        { stroke: #6e7681; stroke-width: 0.6; stroke-dasharray: 3 3; }
      .activation { stroke: #6e7681; stroke-width: 0.8; fill: #6e7681; fill-opacity: 0.15; }
    </style>
  </defs>
  <rect class="stroke" x="240" y="48" width="160" height="44" rx="6" ry="6"/>
  <text x="320" y="67" class="item-b">git-directory</text>
  <text x="320" y="83" class="sub">catalogs · persons (optional)</text>
  <rect class="stroke" x="90" y="158" width="160" height="44" rx="6" ry="6"/>
  <text x="170" y="177" class="item-b">git-forms</text>
  <text x="170" y="193" class="sub">schema-driven documents</text>
  <rect class="stroke" x="270" y="158" width="160" height="44" rx="6" ry="6"/>
  <text x="350" y="177" class="item-b">git-crypto</text>
  <text x="350" y="193" class="sub">keyring (optional)</text>
  <rect class="stroke" x="450" y="158" width="160" height="44" rx="6" ry="6"/>
  <text x="530" y="177" class="item-b">git-signing</text>
  <text x="530" y="193" class="sub">signatures (optional)</text>
  <rect class="stroke" x="630" y="158" width="160" height="44" rx="6" ry="6"/>
  <text x="710" y="177" class="item-b">git-timestamp</text>
  <text x="710" y="193" class="sub">RFC 3161 (optional)</text>
  <rect class="stroke" x="270" y="268" width="160" height="44" rx="6" ry="6"/>
  <text x="350" y="287" class="item-b">git-store</text>
  <text x="350" y="303" class="sub">drafts · saving · index</text>
  <rect class="stroke" x="50" y="378" width="160" height="44" rx="6" ry="6"/>
  <text x="130" y="397" class="item-b">git-worktrees</text>
  <text x="130" y="413" class="sub">linked working trees</text>
  <rect class="stroke" x="270" y="378" width="160" height="44" rx="6" ry="6"/>
  <text x="350" y="397" class="item-b">git-core</text>
  <text x="350" y="413" class="sub">JGit level</text>
  <rect class="stroke-d" x="630" y="378" width="160" height="44" rx="6" ry="6"/>
  <text x="710" y="397" class="item-b">git-testing</text>
  <text x="710" y="413" class="sub">fixtures · generators</text>
  <line class="arrow" x1="300" y1="92" x2="200" y2="158" marker-end="url(#arrow)"/>
  <line class="arrow" x1="340" y1="92" x2="345" y2="158" marker-end="url(#arrow)"/>
  <line class="arrow" x1="200" y1="202" x2="310" y2="268" marker-end="url(#arrow)"/>
  <line class="arrow" x1="350" y1="202" x2="350" y2="268" marker-end="url(#arrow)"/>
  <line class="arrow" x1="510" y1="202" x2="390" y2="268" marker-end="url(#arrow)"/>
  <line class="arrow" x1="690" y1="202" x2="420" y2="268" marker-end="url(#arrow)"/>
  <line class="arrow" x1="350" y1="312" x2="350" y2="378" marker-end="url(#arrow)"/>
  <line class="arrow" x1="210" y1="400" x2="270" y2="400" marker-end="url(#arrow)"/>
  <text x="710" y="446" class="sub">no reactor dependency; test scope</text>
  <text x="450" y="488" class="caption">Arrows point from a module to the module it depends on. Third-party dependencies stay in the module that needs them.</text>
</svg>
