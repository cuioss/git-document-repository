<?xml version="1.0" encoding="UTF-8"?>
<!--
  Graph diagram: acyclic, layered dependency graph. Arrows carry the dependency
  direction, which is load-bearing here (graph standard, reads/writes case).
  Box convention: solid = module exists, dashed = module planned (legend top right).
  theme-handling: A (theme-neutral)
  see pm-documents:ref-svg-diagrams/standards/theme-handling.md
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 536"
     role="img" aria-labelledby="title desc"
     font-family="ui-sans-serif, -apple-system, system-ui, 'Segoe UI', sans-serif">
  <title id="title">Module dependency graph of git-document-repository</title>
  <desc  id="desc">Six modules in four layers. Three modules exist and are drawn solid: git-core, which includes the working-tree operations, git-testing and git-store. Three modules are planned and drawn dashed: git-forms, git-timestamp and git-directory; of these, git-timestamp and git-directory are optional modules a consumer may leave out. git-store depends on git-core. git-forms and git-timestamp depend on git-store. git-directory depends on git-forms. git-testing depends on no module of the reactor and is consumed in test scope.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" class="arrow-fill"/>
    </marker>
    <style>
      .sub        { font-size: 11px; fill: #6e7681; text-anchor: middle; font-style: italic; }
      .sub-l      { font-size: 11px; fill: #6e7681; text-anchor: start; font-style: italic; }
      .item-b     { font-size: 12px; fill: #6e7681; font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; text-anchor: middle; font-weight: 700; }
      .caption    { font-size: 11px; fill: #6e7681; text-anchor: middle; font-style: italic; }
      .stroke     { stroke: #6e7681; stroke-width: 1.2; fill: none; }
      .planned    { stroke: #6e7681; stroke-width: 1.2; fill: none; stroke-dasharray: 5 4; }
      .arrow      { stroke: #6e7681; stroke-width: 1.5; fill: none; }
      .arrow-fill { fill: #6e7681; }
    </style>
  </defs>

  <!-- legend -->
  <rect class="stroke"  x="656" y="44" width="28" height="16" rx="4" ry="4"/>
  <text x="696" y="56" class="sub-l">exists</text>
  <rect class="planned" x="656" y="72" width="28" height="16" rx="4" ry="4"/>
  <text x="696" y="84" class="sub-l">planned</text>

  <!-- layer 1 -->
  <rect class="planned" x="150" y="40" width="160" height="60" rx="6" ry="6"/>
  <text x="230" y="62" class="item-b">git-directory</text>
  <text x="230" y="78" class="sub">catalogs · persons</text>
  <text x="230" y="92" class="sub">optional module</text>

  <!-- layer 2 -->
  <rect class="planned" x="150" y="160" width="160" height="60" rx="6" ry="6"/>
  <text x="230" y="186" class="item-b">git-forms</text>
  <text x="230" y="202" class="sub">schema-driven documents</text>
  <rect class="planned" x="390" y="160" width="160" height="60" rx="6" ry="6"/>
  <text x="470" y="182" class="item-b">git-timestamp</text>
  <text x="470" y="198" class="sub">RFC 3161</text>
  <text x="470" y="212" class="sub">optional module</text>

  <!-- layer 3 -->
  <rect class="stroke" x="270" y="280" width="160" height="64" rx="6" ry="6"/>
  <text x="350" y="302" class="item-b">git-store</text>
  <text x="350" y="318" class="sub">drafts · saving · index</text>
  <text x="350" y="333" class="sub">signatures · own timestamp</text>

  <!-- layer 4 -->
  <rect class="stroke" x="270" y="400" width="160" height="60" rx="6" ry="6"/>
  <text x="350" y="422" class="item-b">git-core</text>
  <text x="350" y="438" class="sub">JGit level</text>
  <text x="350" y="452" class="sub">linked working trees</text>
  <rect class="stroke" x="630" y="400" width="160" height="60" rx="6" ry="6"/>
  <text x="710" y="426" class="item-b">git-testing</text>
  <text x="710" y="442" class="sub">fixtures · generators</text>
  <text x="710" y="478" class="sub">test scope · no reactor dependency</text>

  <!-- dependencies: from a module to the module it depends on -->
  <line class="arrow" x1="230" y1="100" x2="230" y2="160" marker-end="url(#arrow)"/>
  <line class="arrow" x1="250" y1="220" x2="320" y2="280" marker-end="url(#arrow)"/>
  <line class="arrow" x1="450" y1="220" x2="380" y2="280" marker-end="url(#arrow)"/>
  <line class="arrow" x1="350" y1="344" x2="350" y2="400" marker-end="url(#arrow)"/>

  <text x="450" y="512" class="caption">Arrows point from a module to the module it depends on. Third-party dependencies stay in the module that needs them.</text>
</svg>
