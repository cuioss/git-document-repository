<?xml version="1.0" encoding="UTF-8"?>
<!--
  Block diagram: three columns, key source / keyring / encrypted data.
  Dashed box = outside Git (stated in the column header and the caption).
  theme-handling: A (theme-neutral)
  see pm-documents:ref-svg-diagrams/standards/theme-handling.md
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 376"
     role="img" aria-labelledby="title desc"
     font-family="ui-sans-serif, -apple-system, system-ui, 'Segoe UI', sans-serif">
  <title id="title">Envelope encryption of the pseudonym keyring</title>
  <desc  id="desc">The key-encryption key (KEK), held outside Git in a KMS, Vault or configuration and versioned, decrypts the keyring file keys/keyring.enc. The keyring maps each pseudonym to the issuer of its identity provider, its sub and one data encryption key (DEK) per retention class, and lists the KEK versions pending destruction. Each DEK decrypts the encrypted entry of its person and the personal fields of that person in documents of its retention class, in any repository; data under a retention duty and erasable data never share a DEK. The dashed box marks what lives outside Git.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" class="arrow-fill"/>
    </marker>
    <style>
      .hdr        { font-size: 15px; font-weight: 600; fill: #6e7681; text-anchor: middle; }
      .name       { font-size: 12px; font-weight: 600; fill: #6e7681; text-anchor: middle; }
      .sub        { font-size: 11px; fill: #6e7681; text-anchor: middle; font-style: italic; }
      .item-c     { font-size: 12px; fill: #6e7681; font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; text-anchor: middle; }
      .item-b     { font-size: 12px; fill: #6e7681; font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; text-anchor: middle; font-weight: 700; }
      .lbl        { font-size: 11px; fill: #6e7681; text-anchor: middle; font-style: italic; }
      .caption    { font-size: 11px; fill: #6e7681; text-anchor: middle; font-style: italic; }
      .stroke     { stroke: #6e7681; stroke-width: 1.2; fill: none; }
      .stroke-d   { stroke: #6e7681; stroke-width: 1.2; fill: none; stroke-dasharray: 5 4; }
      .tint       { stroke: #6e7681; stroke-width: 1.2; fill: #6e7681; fill-opacity: 0.08; }
      .arrow      { stroke: #6e7681; stroke-width: 1.5; fill: none; }
      .arrow-fill { fill: #6e7681; }
      .sep        { stroke: #6e7681; stroke-width: 0.6; stroke-dasharray: 3 3; }
    </style>
  </defs>
  <text x="150" y="32" class="hdr">Outside Git</text>
  <rect class="stroke-d" x="40" y="48" width="220" height="264" rx="6" ry="6"/>
  <rect class="tint" x="70" y="150" width="160" height="56" rx="4" ry="4"/>
  <text x="150" y="174" class="item-b">KEK version n</text>
  <text x="150" y="194" class="sub">key-encryption key</text>
  <text x="150" y="250" class="sub">KMS · Vault · configuration</text>
  <text x="150" y="268" class="sub">versioned; old versions destroyable</text>

  <text x="450" y="32" class="hdr">keys/keyring.enc</text>
  <rect class="stroke" x="320" y="48" width="260" height="264" rx="6" ry="6"/>
  <text x="450" y="82" class="item-c">p-7f3a… → issuer₁, sub₁, DEKs₁</text>
  <text x="450" y="104" class="item-c">p-91c2… → issuer₂, sub₂, DEKs₂</text>
  <text x="450" y="126" class="item-c">p-4be0… → issuer₃, sub₃, DEKs₃</text>
  <text x="450" y="146" class="sub">DEKs: one DEK per retention class</text>
  <text x="450" y="172" class="item-c">pending destruction: v n−1</text>
  <line class="sep" x1="350" y1="190" x2="550" y2="190"/>
  <text x="450" y="218" class="sub">encrypted with KEK version n</text>
  <text x="450" y="236" class="sub">small; rewritten on every erasure</text>

  <text x="750" y="32" class="hdr">Encrypted with a DEK</text>
  <rect class="stroke" x="640" y="48" width="220" height="264" rx="6" ry="6"/>
  <text x="750" y="88" class="item-c">persons/p-7f3a….enc</text>
  <text x="750" y="112" class="item-c">persons/p-91c2….enc</text>
  <text x="750" y="136" class="item-c">persons/p-4be0….enc</text>
  <line class="sep" x1="670" y1="190" x2="830" y2="190"/>
  <text x="750" y="218" class="name">personal fields</text>
  <text x="750" y="236" class="sub">in documents of any repository</text>
  <text x="750" y="262" class="sub">each with the DEK of its person</text>
  <text x="750" y="279" class="sub">and retention class;</text>
  <text x="750" y="296" class="sub">rewritten only when it changes</text>

  <line class="arrow" x1="260" y1="178" x2="318" y2="178" marker-end="url(#arrow)"/>
  <text x="289" y="170" class="lbl">decrypts</text>
  <line class="arrow" x1="580" y1="178" x2="638" y2="178" marker-end="url(#arrow)"/>
  <text x="609" y="170" class="lbl">DEKs</text>

  <text x="450" y="352" class="caption">Everything except the KEK lives in Git; the dashed box is outside Git. One secret outside, no further data store.</text>
</svg>
