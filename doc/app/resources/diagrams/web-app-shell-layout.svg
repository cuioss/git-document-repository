<?xml version="1.0" encoding="UTF-8"?>
<!-- theme-handling: A (theme-neutral); diagram type: block (layout panels).
     Deviation recorded: this is a UI wireframe. No type standard covers wireframes, so it is drawn
     with the block conventions (rounded panels, 1.2 px borders, header and item typography).
     Dashed 0.6 px boxes are form input fields; the dashed rail line is a divider. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 524"
     role="img" aria-labelledby="title desc"
     font-family="ui-sans-serif, -apple-system, system-ui, 'Segoe UI', sans-serif">
  <title id="title">The web app shell with rail, top bar and a triage page of three columns</title>
  <desc id="desc">The AppShell taken over from pm-web-app. On the left the navigation rail lists the lenses Due, SAMM, Threat models, Incidents, ISMS, Catalogs, Reports and Settings. Across the top the top bar holds the command palette, the live indicator fed by the event stream, and the user menu. The main area shows one page template; here the triage page of the SAMM lens with three columns: the scopes, the assessments of the selected scope, and the selected practice as object column with the generated form, its draft state and the approve control saying when step-up follows. On phones a bottom bar replaces the rail.</desc>

  <defs>
    <style>
      .stroke    { stroke: #6e7681; stroke-width: 1.2; fill: none; }
      .thin      { stroke: #6e7681; stroke-width: 0.6; stroke-dasharray: 3 3; fill: none; }
      .hdr       { font-size: 15px; font-weight: 600; fill: #6e7681; }
      .sub       { font-size: 11px; fill: #6e7681; font-style: italic; }
      .item      { font-size: 12px; fill: #6e7681; font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
      .item-bold { font-size: 12px; font-weight: 700; fill: #6e7681; font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
      .caption   { font-size: 11px; fill: #6e7681; text-anchor: middle; font-style: italic; }
    </style>
  </defs>

  <!-- window -->
  <rect class="stroke" x="24" y="24" width="852" height="448" rx="6"/>

  <!-- NavRail -->
  <rect class="stroke" x="40" y="40" width="160" height="416" rx="4"/>
  <text x="56" y="64" class="hdr">NavRail</text>
  <text x="56" y="80" class="sub">lenses</text>
  <text x="56" y="112" class="item">Due</text>
  <text x="56" y="136" class="item-bold">SAMM</text>
  <text x="56" y="160" class="item">Threat models</text>
  <text x="56" y="184" class="item">Incidents</text>
  <text x="56" y="208" class="item">ISMS</text>
  <text x="56" y="232" class="item">Catalogs</text>
  <text x="56" y="256" class="item">Reports</text>
  <line class="thin" x1="56" y1="276" x2="184" y2="276"/>
  <text x="56" y="300" class="item">Settings</text>

  <!-- TopBar -->
  <rect class="stroke" x="216" y="40" width="644" height="56" rx="4"/>
  <text x="232" y="64" class="hdr">TopBar</text>
  <text x="232" y="82" class="sub">breadcrumb</text>
  <text x="400" y="74" class="item">CommandPalette</text>
  <text x="590" y="74" class="item">LiveIndicator</text>
  <text x="760" y="74" class="item">user menu</text>

  <!-- main: TriagePage -->
  <rect class="stroke" x="216" y="112" width="644" height="344" rx="4"/>
  <text x="232" y="136" class="hdr">TriagePage</text>
  <text x="232" y="152" class="sub">column window: scope › assessment › practice</text>

  <rect class="stroke" x="232" y="168" width="152" height="272" rx="4"/>
  <text x="244" y="190" class="item-bold">scopes</text>
  <text x="244" y="214" class="item">team:payments</text>
  <text x="244" y="236" class="item">service:shop</text>
  <text x="244" y="258" class="item">organisation</text>

  <rect class="stroke" x="400" y="168" width="168" height="272" rx="4"/>
  <text x="412" y="190" class="item-bold">assessments</text>
  <text x="412" y="214" class="item">2026-q4 (draft)</text>
  <text x="412" y="236" class="item">2026-q2 (released)</text>
  <text x="412" y="258" class="item">2025-q4 (released)</text>

  <rect class="stroke" x="584" y="168" width="260" height="272" rx="4"/>
  <text x="596" y="190" class="item-bold">ObjectPage: practice</text>
  <text x="596" y="214" class="sub">form generated from the schema</text>
  <rect class="thin" x="596" y="228" width="236" height="28" rx="4"/>
  <text x="604" y="246" class="item">question 1  answer ▾</text>
  <rect class="thin" x="596" y="264" width="236" height="28" rx="4"/>
  <text x="604" y="282" class="item">question 2  answer ▾</text>
  <text x="596" y="316" class="item">saved for you · 12:04</text>
  <rect class="stroke" x="596" y="392" width="236" height="32" rx="4"/>
  <text x="604" y="412" class="item">Approve (confirm with MFA)</text>

  <!-- caption -->
  <text x="450" y="500" class="caption">Shell, templates and components from pm-web-app; on phones a BottomBar replaces the NavRail.</text>
</svg>
