<?xml version="1.0" encoding="UTF-8"?>
<!-- theme-handling: A (theme-neutral); diagram type: graph (asymmetric hub) -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"
     role="img" aria-labelledby="title desc"
     font-family="ui-sans-serif, -apple-system, system-ui, 'Segoe UI', sans-serif">
  <title id="title">The service catalog as the hub the four categories hang on</title>
  <desc id="desc">The service catalog sits in the centre as the hub; each entry carries owner team and role, repositories, dependsOn, protection needs and data classes. On the left the directory resolves the teams and roles named in the hub to persons. On the right four categories refer to service entries: a SAMM assessment takes a team, a service or the organisation as its scope; a threat model belongs to one service and uses its repositories to detect that it is outdated; an incident report names the affected services and inherits their protection needs; the ISMS treats applications as assets and hangs risks and controls on them.</desc>

  <defs>
    <style>
      .hub       { stroke: #6e7681; stroke-width: 1.6; fill: none; }
      .stroke    { stroke: #6e7681; stroke-width: 1.2; fill: none; }
      .conn      { stroke: #6e7681; stroke-width: 1; fill: none; }
      .hdr       { font-size: 15px; font-weight: 600; fill: #6e7681; text-anchor: middle; }
      .sub       { font-size: 11px; fill: #6e7681; text-anchor: middle; font-style: italic; }
      .item      { font-size: 12px; fill: #6e7681; font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
      .lbl       { font-size: 11px; fill: #6e7681; font-style: italic; text-anchor: middle; }
      .caption   { font-size: 11px; fill: #6e7681; text-anchor: middle; font-style: italic; }
    </style>
  </defs>

  <!-- primary node: directory -->
  <rect class="stroke" x="24" y="208" width="176" height="96" rx="6"/>
  <text x="112" y="240" class="hdr">directory</text>
  <text x="112" y="260" class="sub">persons, roles, teams</text>
  <text x="112" y="280" class="sub">resolves team: and role:</text>

  <!-- hub: service catalog -->
  <rect class="hub" x="272" y="152" width="296" height="208" rx="8"/>
  <text x="420" y="184" class="hdr">service catalog</text>
  <text x="420" y="202" class="sub">catalog/services/&lt;id&gt;.yaml</text>
  <text x="296" y="234" class="item">owner: team + role</text>
  <text x="296" y="256" class="item">repositories</text>
  <text x="296" y="278" class="item">dependsOn</text>
  <text x="296" y="300" class="item">protection-needs (C, I, A)</text>
  <text x="296" y="322" class="item">data-classes</text>

  <!-- spokes -->
  <rect class="stroke" x="664" y="40" width="212" height="88" rx="6"/>
  <text x="770" y="72" class="hdr">SAMM</text>
  <text x="770" y="92" class="sub">scope: a team, a service</text>
  <text x="770" y="108" class="sub">or the organisation</text>

  <rect class="stroke" x="664" y="152" width="212" height="88" rx="6"/>
  <text x="770" y="184" class="hdr">threat models</text>
  <text x="770" y="204" class="sub">one per service; repositories</text>
  <text x="770" y="220" class="sub">detect an outdated model</text>

  <rect class="stroke" x="664" y="264" width="212" height="88" rx="6"/>
  <text x="770" y="296" class="hdr">incident reports</text>
  <text x="770" y="316" class="sub">affected services, inherited</text>
  <text x="770" y="332" class="sub">protection needs</text>

  <rect class="stroke" x="664" y="376" width="212" height="88" rx="6"/>
  <text x="770" y="408" class="hdr">ISMS</text>
  <text x="770" y="428" class="sub">applications as assets;</text>
  <text x="770" y="444" class="sub">risks and controls on them</text>

  <!-- connectors -->
  <line class="conn" x1="200" y1="256" x2="272" y2="256"/>
  <text x="236" y="248" class="lbl">resolves</text>
  <line class="conn" x1="568" y1="188" x2="664" y2="84"/>
  <line class="conn" x1="568" y1="224" x2="664" y2="196"/>
  <line class="conn" x1="568" y1="296" x2="664" y2="308"/>
  <line class="conn" x1="568" y1="332" x2="664" y2="420"/>

  <!-- caption -->
  <text x="450" y="512" class="caption">Documents refer to services, teams and roles by stable id; the catalog itself holds no personal data.</text>
</svg>
