<?xml version="1.0" encoding="UTF-8"?>
<!-- theme-handling: A (theme-neutral); diagram type: deployment.
     The organisation enclosure is also the trust boundary (closed-rect form, dashed 8 4 at 2.0 px). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 712"
     role="img" aria-labelledby="title desc"
     font-family="ui-sans-serif, -apple-system, system-ui, 'Segoe UI', sans-serif">
  <title id="title">CISOs-Friend production deployment in remote mode and the systems it relies on</title>
  <desc id="desc">Production deployment in remote mode. The organisation enclosure is the trust boundary: outside it sit two unauthenticated callers, a browser running the web app with a session cookie and an AI agent as MCP client with a bearer token; inside it every request is authenticated. Both callers reach the CISOs-Friend container over HTTPS on port 8443, and both edges cross the trust boundary. The container is first-party: a Quarkus native image in a distroless image running as nonroot; it serves the static web app, the REST API with its event stream, the MCP endpoint as OAuth 2.1 resource, the application services, the git-document-repository libraries and JGit; management runs over HTTP on port 9000. Mounted into it are the persistent volume for the repositories, the configuration directory and the secrets. The container talks over HTTPS to the systems the organisation already runs: the identity provider with Token Sheriff, the Git server for fetch and push (the Git server sends push webhooks to the container over HTTPS on port 8443), the KMS or Vault for the commit-signing key and the key-encryption key, an optional RFC 3161 timestamp authority, the issue tracker in which measures are created as issues, and verinice through an optional bridge that is disabled by default, and the ticket system and the chat, from which the incident timeline is read and into which nothing is written. Security and read-access events reach the SIEM as log records through the operator's log pipeline.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" class="arrow-fill"/>
    </marker>
    <style>
      .stroke      { stroke: #6e7681; stroke-width: 1.2; fill: none; }
      .encl        { font-size: 13px; font-weight: 600; fill: #6e7681; }
      .encl-sub    { font-size: 11px; fill: #6e7681; font-style: italic; }
      .item        { font-size: 12px; fill: #6e7681; font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
      .own-bar     { stroke: #6e7681; stroke-width: 3; }
      .divider     { stroke: #6e7681; stroke-width: 0.6; stroke-dasharray: 3 3; }
      .trust       { stroke: #6e7681; stroke-width: 2; stroke-dasharray: 8 4; fill: none; }
      .trust-lbl   { font-size: 11px; font-weight: 600; fill: #6e7681; }
      .trust-cross { stroke: #6e7681; stroke-width: 1.2; fill: none; }
      .arrow       { stroke: #6e7681; stroke-width: 1.5; fill: none; }
      .arrow-fill  { fill: #6e7681; }
      .edge-lbl    { font-size: 11px; fill: #6e7681; text-anchor: middle; font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
      .mount-stem  { stroke: #6e7681; stroke-width: 1; stroke-dasharray: 2 2; fill: none; }
      .mount       { font-size: 10px; fill: #6e7681; font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
    </style>
  </defs>

  <!-- callers outside the trust boundary -->
  <rect class="stroke" x="24" y="176" width="160" height="72" rx="4"/>
  <text x="36" y="200" class="encl">browser</text>
  <text x="36" y="216" class="encl-sub">web app (SPA)</text>
  <text x="36" y="236" class="item">session cookie</text>

  <rect class="stroke" x="24" y="416" width="160" height="72" rx="4"/>
  <text x="36" y="440" class="encl">AI agent</text>
  <text x="36" y="456" class="encl-sub">MCP client, OAuth 2.1</text>
  <text x="36" y="476" class="item">bearer token</text>

  <!-- organisation enclosure (depth 1) = trust boundary -->
  <text x="280" y="32" class="trust-lbl">trust boundary — authenticated</text>
  <rect class="trust" x="280" y="40" width="896" height="648" rx="8"/>
  <text x="292" y="64" class="encl">organisation</text>
  <text x="292" y="80" class="encl-sub">the application and the systems it relies on</text>

  <!-- CISOs-Friend container (depth 2, first-party) -->
  <rect class="stroke" x="304" y="112" width="360" height="496" rx="4"/>
  <line class="own-bar" x1="304" y1="120" x2="304" y2="600"/>
  <text x="316" y="136" class="encl">cisos-friend container</text>
  <text x="316" y="152" class="encl-sub">Quarkus native image, distroless, nonroot</text>
  <text x="328" y="192" class="item">web app (static SPA)</text>
  <text x="328" y="220" class="item">/api/v1 + event stream</text>
  <text x="328" y="248" class="item">/mcp (OAuth 2.1 resource)</text>
  <line class="divider" x1="320" y1="272" x2="648" y2="272"/>
  <text x="328" y="300" class="item">application services</text>
  <text x="328" y="328" class="item">git-document-repository</text>
  <text x="328" y="356" class="item">JGit (in-core, HTTPS)</text>
  <line class="divider" x1="320" y1="380" x2="648" y2="380"/>
  <text x="328" y="408" class="item">listener   HTTPS :8443</text>
  <text x="328" y="436" class="item">management HTTP :9000</text>

  <!-- mounted material: 12 px dashed stems, no arrowheads -->
  <line class="mount-stem" x1="372" y1="608" x2="372" y2="620"/>
  <rect class="stroke" x="304" y="620" width="136" height="18" rx="4"/>
  <text x="312" y="633" class="mount">/app/data (volume)</text>
  <line class="mount-stem" x1="484" y1="608" x2="484" y2="620"/>
  <rect class="stroke" x="448" y="620" width="72" height="18" rx="4"/>
  <text x="456" y="633" class="mount">config/</text>
  <line class="mount-stem" x1="580" y1="608" x2="580" y2="620"/>
  <rect class="stroke" x="528" y="620" width="104" height="18" rx="4"/>
  <text x="536" y="633" class="mount">/run/secrets</text>

  <!-- external systems (depth 2, no accent bar) -->
  <rect class="stroke" x="760" y="112" width="392" height="56" rx="4"/>
  <text x="772" y="134" class="encl">identity provider + Token Sheriff</text>
  <text x="772" y="150" class="encl-sub">login, groups, step-up, token validation</text>

  <rect class="stroke" x="760" y="184" width="392" height="56" rx="4"/>
  <text x="772" y="206" class="encl">Git server</text>
  <text x="772" y="222" class="encl-sub">GitHub, GitLab, Gitea, Bitbucket: truth and backup; push webhooks</text>

  <rect class="stroke" x="760" y="256" width="392" height="56" rx="4"/>
  <text x="772" y="278" class="encl">KMS or Vault</text>
  <text x="772" y="294" class="encl-sub">commit-signing key, key-encryption key</text>

  <rect class="stroke" x="760" y="328" width="392" height="56" rx="4"/>
  <text x="772" y="350" class="encl">timestamp authority</text>
  <text x="772" y="366" class="encl-sub">RFC 3161, optional</text>

  <rect class="stroke" x="760" y="400" width="392" height="56" rx="4"/>
  <text x="772" y="422" class="encl">SIEM</text>
  <text x="772" y="438" class="encl-sub">security and read-access events, via the operator's log pipeline</text>

  <rect class="stroke" x="760" y="472" width="392" height="56" rx="4"/>
  <text x="772" y="494" class="encl">issue tracker, verinice</text>
  <text x="772" y="510" class="encl-sub">measures created as issues; verinice bridge optional, off by default</text>

  <rect class="stroke" x="760" y="544" width="392" height="56" rx="4"/>
  <text x="772" y="566" class="encl">ticket system, chat</text>
  <text x="772" y="582" class="encl-sub">incident timeline read; nothing written into them</text>

  <!-- inbound edges, crossing the trust boundary -->
  <line class="arrow" x1="184" y1="212" x2="304" y2="212" marker-end="url(#arrow)"/>
  <text x="232" y="204" class="edge-lbl">HTTPS :8443</text>
  <circle class="trust-cross" cx="280" cy="212" r="3.5"/>
  <line class="arrow" x1="184" y1="452" x2="304" y2="452" marker-end="url(#arrow)"/>
  <text x="232" y="444" class="edge-lbl">HTTPS :8443</text>
  <circle class="trust-cross" cx="280" cy="452" r="3.5"/>

  <!-- edges inside the organisation -->
  <line class="arrow" x1="664" y1="140" x2="760" y2="140" marker-end="url(#arrow)"/>
  <text x="712" y="132" class="edge-lbl">HTTPS</text>
  <line class="arrow" x1="664" y1="200" x2="760" y2="200" marker-end="url(#arrow)"/>
  <text x="712" y="192" class="edge-lbl">HTTPS</text>
  <line class="arrow" x1="760" y1="224" x2="664" y2="224" marker-end="url(#arrow)"/>
  <text x="712" y="240" class="edge-lbl">HTTPS :8443</text>
  <line class="arrow" x1="664" y1="284" x2="760" y2="284" marker-end="url(#arrow)"/>
  <text x="712" y="276" class="edge-lbl">HTTPS</text>
  <line class="arrow" x1="664" y1="356" x2="760" y2="356" marker-end="url(#arrow)"/>
  <text x="712" y="348" class="edge-lbl">HTTPS</text>
  <line class="arrow" x1="664" y1="428" x2="760" y2="428" marker-end="url(#arrow)"/>
  <text x="712" y="420" class="edge-lbl">log records</text>
  <line class="arrow" x1="664" y1="500" x2="760" y2="500" marker-end="url(#arrow)"/>
  <text x="712" y="492" class="edge-lbl">HTTPS</text>
  <line class="arrow" x1="664" y1="572" x2="760" y2="572" marker-end="url(#arrow)"/>
  <text x="712" y="564" class="edge-lbl">HTTPS</text>
</svg>
