<?xml version="1.0" encoding="UTF-8"?>
<!-- theme-handling: A (theme-neutral); diagram type: block (three-column comparison) -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500"
     role="img" aria-labelledby="title desc"
     font-family="ui-sans-serif, -apple-system, system-ui, 'Segoe UI', sans-serif">
  <title id="title">The default repository cut of CISOs-Friend by confidentiality and retention</title>
  <desc id="desc">Three columns by confidentiality class. Widely readable inside the organisation: isms-core with policies, scope and the statement of applicability; samm-assessments for development and security; and directory, whose catalogs are plain while the entries of persons and the keyring are encrypted. Restricted: isms-register with assets, risks and controls, and threat-models for models not kept in the applications' repositories. Strongly restricted: one isms-incidents repository per year, for example 2026 and 2025, each with a retention period after which the whole repository is deleted. All other repositories are kept without a retention end. References between repositories use stable ids such as isms-register:risk/R-042.</desc>

  <defs>
    <style>
      .col-header { font-size: 15px; font-weight: 600; fill: #6e7681; text-anchor: middle; }
      .col-sub    { font-size: 11px; fill: #6e7681; text-anchor: middle; font-style: italic; }
      .stroke     { stroke: #6e7681; stroke-width: 1.2; fill: none; }
      .sep        { stroke: #6e7681; stroke-width: 0.6; stroke-dasharray: 3 3; }
      .item       { font-size: 12px; fill: #6e7681; font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
      .item-bold  { font-size: 12px; font-weight: 700; fill: #6e7681; font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
      .note       { font-size: 11px; fill: #6e7681; font-style: italic; }
      .caption    { font-size: 12px; fill: #6e7681; text-anchor: middle; font-style: italic; }
    </style>
  </defs>

  <!-- column headers -->
  <text x="150" y="40" class="col-header">widely readable</text>
  <text x="150" y="58" class="col-sub">inside the organisation</text>
  <text x="450" y="40" class="col-header">restricted</text>
  <text x="450" y="58" class="col-sub">named groups</text>
  <text x="750" y="40" class="col-header">strongly restricted</text>
  <text x="750" y="58" class="col-sub">a small circle</text>

  <!-- column 1 -->
  <rect class="stroke" x="24" y="80" width="252" height="80" rx="6"/>
  <text x="40" y="104" class="item-bold">isms-core</text>
  <text x="40" y="126" class="item">policies, scope,</text>
  <text x="40" y="146" class="item">statement of applicability</text>

  <rect class="stroke" x="24" y="176" width="252" height="64" rx="6"/>
  <text x="40" y="200" class="item-bold">samm-assessments</text>
  <text x="40" y="222" class="item">development and security</text>

  <rect class="stroke" x="24" y="256" width="252" height="108" rx="6"/>
  <text x="40" y="280" class="item-bold">directory</text>
  <text x="40" y="302" class="item">catalog/  plain</text>
  <line class="sep" x1="40" y1="314" x2="260" y2="314"/>
  <text x="40" y="332" class="item">persons/  encrypted</text>
  <text x="40" y="352" class="item">keys/     encrypted</text>

  <!-- column 2 -->
  <rect class="stroke" x="324" y="80" width="252" height="80" rx="6"/>
  <text x="340" y="104" class="item-bold">isms-register</text>
  <text x="340" y="126" class="item">assets, risks, controls,</text>
  <text x="340" y="146" class="item">suppliers, nonconformities</text>

  <rect class="stroke" x="324" y="176" width="252" height="80" rx="6"/>
  <text x="340" y="200" class="item-bold">threat-models</text>
  <text x="340" y="222" class="item">models not kept in the</text>
  <text x="340" y="242" class="item">applications' repositories</text>

  <!-- column 3 -->
  <rect class="stroke" x="624" y="80" width="252" height="64" rx="6"/>
  <text x="640" y="104" class="item-bold">isms-incidents-2026</text>
  <text x="640" y="126" class="item">reports of one year</text>

  <rect class="stroke" x="624" y="160" width="252" height="64" rx="6"/>
  <text x="640" y="184" class="item-bold">isms-incidents-2025</text>
  <text x="640" y="206" class="item">reports of one year</text>

  <text x="640" y="252" class="note">after the retention period the whole</text>
  <text x="640" y="268" class="note">repository is deleted; no history rewrite</text>

  <!-- retention band -->
  <line class="sep" x1="24" y1="396" x2="876" y2="396"/>
  <text x="300" y="424" class="col-sub">retention: unlimited</text>
  <text x="750" y="424" class="col-sub">retention: period per year</text>

  <!-- caption -->
  <text x="450" y="472" class="caption">One confidentiality class and one retention class per repository; references use stable ids (isms-register:risk/R-042).</text>
</svg>
