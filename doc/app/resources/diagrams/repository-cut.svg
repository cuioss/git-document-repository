<?xml version="1.0" encoding="UTF-8"?>
<!-- theme-handling: A (theme-neutral); diagram type: block (four-column comparison by readership) -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 436"
     role="img" aria-labelledby="title desc"
     font-family="ui-sans-serif, -apple-system, system-ui, 'Segoe UI', sans-serif">
  <title id="title">The default repository cut of Trailhand by confidentiality and retention</title>
  <desc id="desc">Four columns by readership. Widely readable inside the organisation: isms-core with policies, scope, audit and management review reports, and directory, whose catalogs, person entries under pseudonyms and record of erasures are plain and readable inside the organisation. Development and security: samm-assessments with SAMM scopes, assessments and targets. Restricted to named groups: isms-register with the risk register, and threat-models with the threat models of all services. Strongly restricted: one isms-incidents repository per year, for example 2026 and 2025, each with a retention period after which the whole repository is deleted. All other repositories are kept without a retention end. References between repositories use stable ids such as isms-register:risk/R-042.</desc>

  <defs>
    <style>
      .col-header { font-size: 15px; font-weight: 600; fill: #6e7681; text-anchor: middle; }
      .col-sub    { font-size: 11px; fill: #6e7681; text-anchor: middle; font-style: italic; }
      .stroke     { stroke: #6e7681; stroke-width: 1.2; fill: none; }
      .sep        { stroke: #6e7681; stroke-width: 0.6; stroke-dasharray: 3 3; }
      .item       { font-size: 12px; fill: #6e7681; font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
      .item-bold  { font-size: 12px; font-weight: 700; fill: #6e7681; font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
      .text       { font-size: 12px; fill: #6e7681; }
      .note       { font-size: 11px; fill: #6e7681; font-style: italic; }
      .caption    { font-size: 11px; fill: #6e7681; text-anchor: middle; font-style: italic; }
    </style>
  </defs>

  <!-- column headers -->
  <text x="134" y="40" class="col-header">widely readable</text>
  <text x="134" y="58" class="col-sub">inside the organisation</text>
  <text x="378" y="40" class="col-header">development and security</text>
  <text x="378" y="58" class="col-sub">development teams, security</text>
  <text x="622" y="40" class="col-header">restricted</text>
  <text x="622" y="58" class="col-sub">named groups</text>
  <text x="866" y="40" class="col-header">strongly restricted</text>
  <text x="866" y="58" class="col-sub">a small circle</text>

  <!-- column 1: widely readable -->
  <rect class="stroke" x="24" y="80" width="220" height="80" rx="6"/>
  <text x="40" y="104" class="item-bold">isms-core</text>
  <text x="40" y="126" class="text">policies, scope, audit</text>
  <text x="40" y="146" class="text">and management reviews</text>

  <rect class="stroke" x="24" y="176" width="220" height="132" rx="6"/>
  <text x="40" y="200" class="item-bold">directory</text>
  <text x="40" y="222" class="item">catalog/</text>
  <text x="120" y="222" class="text">plain, everyone</text>
  <line class="sep" x1="40" y1="234" x2="228" y2="234"/>
  <text x="40" y="252" class="item">persons/</text>
  <text x="150" y="252" class="text">pseudonyms</text>
  <text x="40" y="272" class="item">erasures.yaml</text>
  <text x="150" y="272" class="text">pseudonyms</text>
  <text x="40" y="294" class="note">login only as a hash</text>

  <!-- column 2: development and security -->
  <rect class="stroke" x="268" y="80" width="220" height="80" rx="6"/>
  <text x="284" y="104" class="item-bold">samm-assessments</text>
  <text x="284" y="126" class="text">SAMM scopes, assessments</text>
  <text x="284" y="146" class="text">and targets</text>

  <!-- column 3: restricted -->
  <rect class="stroke" x="512" y="80" width="220" height="80" rx="6"/>
  <text x="528" y="104" class="item-bold">isms-register</text>
  <text x="528" y="126" class="text">the risk register</text>

  <rect class="stroke" x="512" y="176" width="220" height="80" rx="6"/>
  <text x="528" y="200" class="item-bold">threat-models</text>
  <text x="528" y="222" class="text">the threat models</text>
  <text x="528" y="242" class="text">of all services</text>

  <!-- column 4: strongly restricted -->
  <rect class="stroke" x="756" y="80" width="220" height="64" rx="6"/>
  <text x="772" y="104" class="item-bold">isms-incidents-2026</text>
  <text x="772" y="126" class="text">reports of one year</text>

  <rect class="stroke" x="756" y="160" width="220" height="64" rx="6"/>
  <text x="772" y="184" class="item-bold">isms-incidents-2025</text>
  <text x="772" y="206" class="text">reports of one year</text>

  <text x="772" y="252" class="note">after the retention period the</text>
  <text x="772" y="268" class="note">whole repository is deleted;</text>
  <text x="772" y="284" class="note">no history rewrite</text>

  <!-- retention band -->
  <line class="sep" x1="24" y1="344" x2="976" y2="344"/>
  <text x="378" y="370" class="col-sub">retention: unlimited</text>
  <text x="866" y="370" class="col-sub">retention: period per year</text>

  <!-- caption -->
  <text x="500" y="412" class="caption">One readership and one retention period per repository; references use stable ids (isms-register:risk/R-042).</text>
</svg>
