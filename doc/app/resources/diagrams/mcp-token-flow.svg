<?xml version="1.0" encoding="UTF-8"?>
<!-- theme-handling: A (theme-neutral); diagram type: sequence -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 616"
     role="img" aria-labelledby="title desc"
     font-family="ui-sans-serif, -apple-system, system-ui, 'Segoe UI', sans-serif">
  <title id="title">An AI agent obtains an audience-bound token and saves through the MCP server</title>
  <desc id="desc">Five actors: the AI agent, the identity provider, the MCP endpoint of CISOs-Friend, the application services and the Git server. The agent first calls the MCP endpoint without a token and receives 401 with the resource metadata address. It reads the protected resource metadata and learns the authorization server and the scopes. It authorises at the identity provider with PKCE S256 and the resource parameter naming the MCP endpoint, and receives an access token whose audience is that endpoint. It calls the MCP endpoint again with the bearer token. The endpoint validates signature, issuer, expiry, audience and scope through Token Sheriff, then calls the application services as the user, with the token's scopes intersected with the user's rights. The services push to the Git server with the technical user and signed trailers naming user and agent client. The results return; the agent receives the tool result without any credential. A missing scope is answered with 403 insufficient_scope; an invalid, expired or foreign-audience token with 401.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" class="arrow-fill"/>
    </marker>
    <style>
      .col-header   { font-size: 15px; font-weight: 600; fill: #6e7681; text-anchor: middle; }
      .stroke       { stroke: #6e7681; stroke-width: 1.2; fill: none; }
      .sep          { stroke: #6e7681; stroke-width: 0.6; stroke-dasharray: 3 3; }
      .arrow        { stroke: #6e7681; stroke-width: 1.5; fill: none; }
      .arrow-return { stroke: #6e7681; stroke-width: 1.5; fill: none; stroke-dasharray: 5 4; }
      .arrow-fill   { fill: #6e7681; }
      .arrow-lbl    { font-size: 11px; fill: #6e7681; text-anchor: middle; font-style: italic; }
      .note-lbl     { font-size: 11px; fill: #6e7681; font-style: italic; }
      .activation   { stroke: #6e7681; stroke-width: 0.8; fill: #6e7681; opacity: 0.15; }
      .col-sub      { font-size: 11px; fill: #6e7681; text-anchor: middle; font-style: italic; }
      .caption      { font-size: 12px; fill: #6e7681; text-anchor: middle; font-style: italic; }
    </style>
  </defs>

  <!-- actors and lifelines -->
  <text x="100" y="30" class="col-header">AI agent</text>
  <rect class="stroke" x="24" y="42" width="152" height="36" rx="6"/>
  <text x="100" y="64" class="col-sub">MCP client</text>
  <line class="sep" x1="100" y1="80" x2="100" y2="568"/>

  <text x="320" y="30" class="col-header">identity provider</text>
  <rect class="stroke" x="244" y="42" width="152" height="36" rx="6"/>
  <text x="320" y="64" class="col-sub">authorization server</text>
  <line class="sep" x1="320" y1="80" x2="320" y2="568"/>

  <text x="540" y="30" class="col-header">MCP endpoint</text>
  <rect class="stroke" x="464" y="42" width="152" height="36" rx="6"/>
  <text x="540" y="64" class="col-sub">protected resource</text>
  <line class="sep" x1="540" y1="80" x2="540" y2="568"/>

  <text x="760" y="30" class="col-header">services</text>
  <rect class="stroke" x="684" y="42" width="152" height="36" rx="6"/>
  <text x="760" y="64" class="col-sub">rules, rights, levels</text>
  <line class="sep" x1="760" y1="80" x2="760" y2="568"/>

  <text x="990" y="30" class="col-header">Git server</text>
  <rect class="stroke" x="914" y="42" width="152" height="36" rx="6"/>
  <text x="990" y="64" class="col-sub">truth and backup</text>
  <line class="sep" x1="990" y1="80" x2="990" y2="568"/>

  <!-- activation bars -->
  <rect class="activation" x="535" y="330" width="10" height="212"/>
  <rect class="activation" x="755" y="420" width="10" height="92"/>
  <rect class="activation" x="985" y="452" width="10" height="30"/>

  <!-- discovery -->
  <line class="arrow" x1="100" y1="112" x2="540" y2="112" marker-end="url(#arrow)"/>
  <text x="430" y="104" class="arrow-lbl">POST /mcp (no token)</text>
  <line class="arrow-return" x1="540" y1="142" x2="100" y2="142" marker-end="url(#arrow)"/>
  <text x="430" y="134" class="arrow-lbl">401 + resource_metadata, scope</text>

  <line class="arrow" x1="100" y1="182" x2="540" y2="182" marker-end="url(#arrow)"/>
  <text x="430" y="174" class="arrow-lbl">GET protected resource metadata</text>
  <line class="arrow-return" x1="540" y1="212" x2="100" y2="212" marker-end="url(#arrow)"/>
  <text x="430" y="204" class="arrow-lbl">authorization servers, scopes</text>

  <!-- authorization -->
  <line class="arrow" x1="100" y1="252" x2="320" y2="252" marker-end="url(#arrow)"/>
  <text x="210" y="244" class="arrow-lbl">PKCE S256, resource = MCP URI</text>
  <line class="arrow-return" x1="320" y1="282" x2="100" y2="282" marker-end="url(#arrow)"/>
  <text x="210" y="274" class="arrow-lbl">access token, aud = MCP URI</text>

  <!-- authenticated call -->
  <line class="arrow" x1="100" y1="330" x2="535" y2="330" marker-end="url(#arrow)"/>
  <text x="430" y="322" class="arrow-lbl">POST /mcp, Bearer: tools/call save</text>

  <!-- self-message: validation -->
  <path class="arrow" d="M545,350 L580,350 L580,378 L547,378" marker-end="url(#arrow)"/>
  <text x="588" y="362" class="note-lbl">Token Sheriff: signature, iss,</text>
  <text x="588" y="376" class="note-lbl">exp, aud, scope</text>

  <line class="arrow" x1="545" y1="420" x2="755" y2="420" marker-end="url(#arrow)"/>
  <text x="650" y="412" class="arrow-lbl">save as user: scopes and rights</text>

  <line class="arrow" x1="765" y1="452" x2="985" y2="452" marker-end="url(#arrow)"/>
  <text x="875" y="430" class="arrow-lbl">push as technical user,</text>
  <text x="875" y="444" class="arrow-lbl">trailers name user + client</text>
  <line class="arrow-return" x1="985" y1="482" x2="765" y2="482" marker-end="url(#arrow)"/>
  <text x="875" y="474" class="arrow-lbl">accepted</text>

  <line class="arrow-return" x1="755" y1="512" x2="545" y2="512" marker-end="url(#arrow)"/>
  <text x="650" y="504" class="arrow-lbl">SAVED</text>

  <line class="arrow-return" x1="535" y1="542" x2="100" y2="542" marker-end="url(#arrow)"/>
  <text x="430" y="534" class="arrow-lbl">tool result, no credentials</text>

  <!-- caption -->
  <text x="550" y="600" class="caption">Missing scope: 403 insufficient_scope with the required scope. Invalid, expired or foreign-audience token: 401.</text>
</svg>
