<?xml version="1.0" encoding="UTF-8"?>
<!-- theme-handling: A (theme-neutral: own ground, baked palette); diagram type: brand sketch -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 190"
     role="img" aria-labelledby="title desc"
     font-family="ui-sans-serif, -apple-system, system-ui, 'Segoe UI', sans-serif">
  <title id="title">Sketch of the proposed brand mark: a document page with a trail of three commit nodes</title>
  <desc id="desc">The mark is a document page with a folded corner. A winding trail runs over the page through three round nodes, the commits of the history; the last node is the gold one, the newest commit. Shown in colour at 96 pixels, in one colour at 96 pixels, and in colour at 32 and 16 pixels.</desc>
  <defs>
    <symbol id="mark" viewBox="0 0 24 24">
      <path d="M5.5 2.5h9l4 4v15h-13z" fill="#F6DDB0" stroke="#2A1A10" stroke-width="1.4" stroke-linejoin="round"/>
      <path d="M14.5 2.5v4h4" fill="none" stroke="#2A1A10" stroke-width="1.4" stroke-linejoin="round"/>
      <path d="M8.5 17.5c0-3 6-2 6-5s-4-2-4-5" fill="none" stroke="#A0602E" stroke-width="1.4" stroke-linecap="round"/>
      <circle cx="8.5" cy="17.5" r="1.7" fill="#E17512" stroke="#2A1A10" stroke-width="1.1"/>
      <circle cx="14.5" cy="12.5" r="1.7" fill="#E17512" stroke="#2A1A10" stroke-width="1.1"/>
      <circle cx="10.5" cy="7.5" r="2.1" fill="#F2B630" stroke="#2A1A10" stroke-width="1.1"/>
    </symbol>
    <symbol id="mono" viewBox="0 0 24 24">
      <mask id="cut" maskUnits="userSpaceOnUse" x="0" y="0" width="24" height="24">
        <rect width="24" height="24" fill="#fff"/>
        <path d="M8.5 17.5c0-3 6-2 6-5s-4-2-4-5" fill="none" stroke="#000" stroke-width="1.5" stroke-linecap="round"/>
        <circle cx="8.5" cy="17.5" r="1.9" fill="#000"/>
        <circle cx="14.5" cy="12.5" r="1.9" fill="#000"/>
        <circle cx="10.5" cy="7.5" r="2.3" fill="#000"/>
      </mask>
      <path mask="url(#cut)" d="M5.5 2.5h9l4 4v15h-13z" fill="currentColor"/>
    </symbol>
  </defs>
  <rect width="520" height="190" rx="8" fill="#FFFFFF" stroke="#D0D7DE"/>
  <use href="#mark" x="30" y="30" width="96" height="96"/>
  <g color="#2A1A10"><use href="#mono" x="170" y="30" width="96" height="96"/></g>
  <use href="#mark" x="310" y="78" width="32" height="32"/>
  <use href="#mark" x="370" y="86" width="16" height="16"/>
  <g font-size="12" fill="#57606A" text-anchor="middle">
    <text x="78" y="152">colour</text>
    <text x="218" y="152">one colour</text>
    <text x="326" y="152">32 px</text>
    <text x="378" y="152">16 px</text>
  </g>
  <text x="260" y="176" font-size="11" fill="#57606A" text-anchor="middle" font-style="italic">Sketch for discussion, not a final drawing</text>
</svg>
